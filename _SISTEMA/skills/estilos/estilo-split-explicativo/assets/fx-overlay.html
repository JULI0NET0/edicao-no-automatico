<!doctype html>
<!--
  Finishing layer: film grain (grain-overlay, stepped deterministically at
  12 fps instead of CSS keyframes so it is seek-safe) + vignette.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #fx-grain {
          position: absolute;
          left: -540px;
          top: -960px;
          width: 2160px;
          height: 3840px;
          opacity: 0.07;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
          mix-blend-mode: overlay;
        }
        #fx-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 80% 72% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.4) 100%);
        }
      </style>
      <div id="root" data-composition-id="fx-overlay" data-width="1080" data-height="1920">
        <div id="fx-grain"></div>
        <div id="fx-vignette"></div>
      </div>
      <script>
        (function () {
          var DURATION = 50.7;
          var tl = gsap.timeline({ paused: true });
          for (var k = 0; k < DURATION * 12; k++) {
            tl.set("#fx-grain", { x: ((k * 73) % 211) - 105, y: ((k * 131) % 197) - 98 }, k / 12);
          }
          window.__timelines = window.__timelines || {};
          window.__timelines["fx-overlay"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
