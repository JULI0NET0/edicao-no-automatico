<!doctype html>
<!--
  Beat E — split screen, "vira líder de mercado em todas as áreas".
  bar-chart-race mechanics: values are piecewise-linear keyframes, ranks are
  baked once on a fixed grid, each row's position is SOLVED from rank with a
  smoothstep swap, and the accent is binary (only the current leader glows).
  Everything renders as a pure function of t from one driver tween.
  Illustrative ranking (labelled as such) — no real market numbers.
  Mounted at global 17.05 — cue constants below are GLOBAL seconds.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          font-family: "Montserrat", sans-serif;
        }
        #e-panel {
          position: absolute;
          left: 0;
          top: 1040px;
          width: 1080px;
          height: 880px;
          overflow: hidden;
          background: radial-gradient(ellipse 70% 60% at 50% 40%, #1C1C1C 0%, #111111 62%, #0A0A0A 100%);
        }
        #e-edge {
          position: absolute;
          left: 0;
          top: 1034px;
          width: 1080px;
          height: 6px;
          background: linear-gradient(90deg, rgba(249, 115, 22, 0), #F97316 20%, #FDBA74 50%, #F97316 80%, rgba(249, 115, 22, 0));
          box-shadow: 0 0 30px rgba(249, 115, 22, 0.8);
        }
        #e-head {
          position: absolute;
          left: 60px;
          top: 138px;
          width: 960px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        #e-title {
          font-weight: 800;
          font-size: 26px;
          letter-spacing: 0.3em;
          color: #A8A8A8;
        }
        #e-tag {
          font-weight: 600;
          font-size: 20px;
          letter-spacing: 0.12em;
          color: rgba(255, 255, 255, 0.42);
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 20px;
          padding: 4px 14px;
        }
        #e-plot {
          position: absolute;
          left: 0;
          top: 200px;
          width: 1080px;
          height: 520px;
        }
        .e-row {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 100px;
        }
        .e-label {
          position: absolute;
          left: 60px;
          top: 18px;
          width: 270px;
          font-family: "League Gothic", sans-serif;
          font-size: 58px;
          line-height: 1;
          color: rgba(255, 255, 255, 0.62);
          white-space: nowrap;
        }
        .e-track {
          position: absolute;
          left: 340px;
          top: 16px;
          width: 620px;
          height: 64px;
          border-radius: 12px;
          background: rgba(255, 255, 255, 0.05);
        }
        .e-fill {
          position: absolute;
          left: 0;
          top: 0;
          height: 64px;
          width: 620px;
          border-radius: 12px;
          background: #3A3A3A;
          transform-origin: 0% 50%;
        }
        .e-row.is-apple .e-label {
          color: #fff;
        }
        .e-row.is-apple .e-fill {
          background: #F97316;
          box-shadow: 0 0 30px rgba(249, 115, 22, 0.55);
        }
        .e-row.is-leader .e-fill {
          background: #F97316;
          box-shadow: 0 0 40px rgba(249, 115, 22, 0.6);
        }
        .e-row.is-leader .e-label {
          color: #F97316;
        }
        #e-badge {
          position: absolute;
          left: 880px;
          top: 196px;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          background: #F97316;
          color: #0A0A0A;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 900;
          font-size: 44px;
          box-shadow: 0 10px 40px rgba(249, 115, 22, 0.6);
          opacity: 0;
        }
        #e-areas {
          position: absolute;
          left: 0;
          top: 728px;
          width: 1080px;
          display: flex;
          justify-content: center;
          gap: 26px;
        }
        .e-area {
          position: relative;
          width: 118px;
          height: 118px;
          border-radius: 26px;
          background: rgba(255, 255, 255, 0.06);
          border: 2px solid rgba(255, 255, 255, 0.1);
          opacity: 0;
        }
        .e-area img {
          position: absolute;
          inset: 10px;
          width: 94px;
          height: 94px;
          object-fit: contain;
        }
        .e-check {
          position: absolute;
          right: -10px;
          top: -10px;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: #F97316;
          color: #0A0A0A;
          font-weight: 900;
          font-size: 26px;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="e-lider" data-width="1080" data-height="1920">
        <div id="e-panel">
          <div id="e-head">
            <div id="e-title">QUEM LIDERA O MERCADO</div>
            <div id="e-tag">ILUSTRATIVO</div>
          </div>
          <div id="e-plot"></div>
          <div id="e-badge">#1</div>
          <div id="e-areas"></div>
        </div>
        <div id="e-edge"></div>
      </div>
      <script>
        (function () {
          var OFFSET = 17.05;
          var T = function (g) {
            return g - OFFSET;
          };
          var SHOW = 17.33; // hard cut from the poster stage
          var LEADER_AT = 20.4; // "líder" 20.52
          var EXIT = 22.6;

          // Keyframes (GLOBAL time) and illustrative values.
          var TIMES = [17.5, 18.3, 18.9, 19.5, 20.0, 20.5, 21.2];
          var SERIES = [
            { name: "CONCORRENTE A", v: [88, 89, 90, 90, 91, 91, 90] },
            { name: "CONCORRENTE B", v: [76, 77, 78, 78, 79, 79, 78] },
            { name: "CONCORRENTE C", v: [64, 65, 66, 66, 66, 67, 66] },
            { name: "CONCORRENTE D", v: [52, 53, 53, 54, 54, 54, 53] },
            { name: "APPLE", v: [8, 30, 58, 70, 84, 96, 100], apple: true },
          ];
          var MAX = 100;
          var PITCH = 102;
          var N = SERIES.length;

          function clamp(x, a, b) {
            return x < a ? a : x > b ? b : x;
          }
          function valueAt(g, s) {
            if (g <= TIMES[0]) return s.v[0];
            for (var i = 0; i < TIMES.length - 1; i++) {
              if (g <= TIMES[i + 1]) {
                var f = (g - TIMES[i]) / (TIMES[i + 1] - TIMES[i]);
                return s.v[i] + (s.v[i + 1] - s.v[i]) * f;
              }
            }
            return s.v[s.v.length - 1];
          }
          // Bake integer ranks on a fixed grid; a rank change between two grid
          // points IS the swap, played over one step with smoothstep.
          var STEP = 0.22;
          var G0 = TIMES[0];
          var G1 = TIMES[TIMES.length - 1];
          var RANKS = [];
          for (var g = G0; g <= G1 + 1e-6; g += STEP) {
            var order = SERIES.map(function (s, j) {
              return { j: j, v: valueAt(g, s) };
            });
            order.sort(function (a, b) {
              return b.v - a.v || a.j - b.j;
            });
            var row = [];
            order.forEach(function (o, r) {
              row[o.j] = r;
            });
            RANKS.push(row);
          }
          function rankPos(g, j) {
            var m = (clamp(g, G0, G1) - G0) / STEP;
            var m0 = clamp(Math.floor(m), 0, RANKS.length - 2);
            var e = clamp(m - m0, 0, 1);
            e = e * e * (3 - 2 * e);
            return RANKS[m0][j] + (RANKS[m0 + 1][j] - RANKS[m0][j]) * e;
          }

          var plot = document.getElementById("e-plot");
          var rows = SERIES.map(function (s) {
            var r = document.createElement("div");
            r.className = "e-row" + (s.apple ? " is-apple" : "");
            r.innerHTML = '<div class="e-label"></div><div class="e-track"><div class="e-fill"></div></div>';
            r.querySelector(".e-label").textContent = s.name;
            plot.appendChild(r);
            return { el: r, fill: r.querySelector(".e-fill"), label: r.querySelector(".e-label") };
          });

          var BAR_IN = 0.45; // bars grow from zero on entry
          function render(local) {
            var g = local + OFFSET;
            var grow = clamp((g - SHOW) / BAR_IN, 0, 1);
            grow = 1 - Math.pow(1 - grow, 3);
            var leader = -1;
            var best = -1;
            SERIES.forEach(function (s, j) {
              var v = valueAt(g, s);
              if (v > best) {
                best = v;
                leader = j;
              }
            });
            SERIES.forEach(function (s, j) {
              var v = valueAt(g, s);
              var row = rows[j];
              row.el.style.transform = "translateY(" + (rankPos(g, j) * PITCH).toFixed(2) + "px)";
              row.fill.style.transform = "scaleX(" + ((v / MAX) * grow).toFixed(4) + ")";
              var isLeader = s.apple === true && j === leader && g >= LEADER_AT - 0.1;
              var fillBg = isLeader ? "#F97316" : s.apple ? "#FFFFFF" : "#3A3A3A";
              var glow = isLeader
                ? "0 0 40px rgba(249, 115, 22, 0.6)"
                : s.apple
                  ? "0 0 24px rgba(255, 255, 255, 0.35)"
                  : "none";
              row.fill.style.background = fillBg;
              row.fill.style.boxShadow = glow;
              row.label.style.color = isLeader ? "#F97316" : s.apple ? "#ffffff" : "rgba(255, 255, 255, 0.62)";
            });
          }

          // "Em todas as áreas": category tiles tick one by one.
          var AREAS = ["phone", "watch", "tablet", "laptop", "earbuds"];
          var areasEl = document.getElementById("e-areas");
          var tiles = AREAS.map(function (a) {
            var d = document.createElement("div");
            d.className = "e-area";
            d.innerHTML = '<img src="assets/img/' + a + '.png" /><div class="e-check">✓</div>';
            areasEl.appendChild(d);
            return d;
          });

          var tl = gsap.timeline({ paused: true });
          gsap.set(["#e-panel", "#e-edge"], { opacity: 0 });
          render(0);
          tl.set(["#e-panel", "#e-edge"], { opacity: 1 }, T(SHOW));
          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: T(EXIT),
              duration: T(EXIT),
              ease: "none",
              onUpdate: function () {
                render(driver.t);
              },
            },
            0,
          );
          // #1 badge (spring-pop) lands on the leader row.
          tl.fromTo(
            "#e-badge",
            { opacity: 0, scale: 0.4, rotation: -20 },
            { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.6)", immediateRender: false },
            T(LEADER_AT + 0.08),
          );
          var areaTimes = [21.5, 21.66, 21.82, 21.98, 22.14];
          tiles.forEach(function (tile, i) {
            tl.fromTo(
              tile,
              { opacity: 0, y: 30, scale: 0.8 },
              { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false },
              T(areaTimes[i] - 0.25),
            );
            tl.fromTo(
              tile.querySelector(".e-check"),
              { opacity: 0, scale: 0.3 },
              { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false },
              T(areaTimes[i] + 0.05),
            );
          });
          // Exit: panel drops away as the grid beat takes the full frame.
          tl.to("#e-panel", { y: 900, duration: 0.4, ease: "power3.in" }, T(EXIT));
          tl.to("#e-edge", { y: 900, opacity: 0, duration: 0.4, ease: "power3.in" }, T(EXIT));

          window.__timelines = window.__timelines || {};
          window.__timelines["e-lider"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
