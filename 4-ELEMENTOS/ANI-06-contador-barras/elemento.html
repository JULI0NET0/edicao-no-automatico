    <div data-hf-id="hf-9hlr" id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="445" data-height="300">

    <script>
      const NS = "http://www.w3.org/2000/svg";

      const L = 4, LOOPS = 3;
      const tl = gsap.timeline({ paused: true });

      const svgEl = (w, h) => { const s = document.createElementNS(NS, "svg"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`); return s; };

      const cells = [];
      function cell(n, name, tech, build) { cells.push({ n, name, tech, build }); }

      /* 01 — Pontilhado: morph de partículas (pessoa → seta) */
      cell("01", "PONTILHADO", "DOTS.fill · morph de partículas", (st) => {
        st.style.background = "#0a0a0a";
        const svg = svgEl(445, 260); st.appendChild(svg);
        const byYX = (a, b) => a.y - b.y || a.x - b.x;
        const A = DOTS.fill(DOTS.SHAPES.person, { step: 15, ox: 164, oy: 14, s: 0.58 }).sort(byYX);
        const B = DOTS.fill(DOTS.SHAPES.arrow, { step: 15, ox: 164, oy: 36, s: 0.58 }).sort(byYX);
        const N = A.length;
        const tgt = A.map((_, i) => B[Math.min(B.length - 1, Math.floor((i * B.length) / N))]);
        A.forEach((p) => { if (p.y < 52) p.color = "#ff7a1a"; });
        const cs = DOTS.draw(svg, A, { r: 3.6 });
        gsap.set(cs, { transformOrigin: "50% 50%" });
        const dx = A.map((p, i) => tgt[i].x - p.x), dy = A.map((p, i) => tgt[i].y - p.y);

        };
      });

      /* 02 — Dispersão e remontagem */
      cell("02", "DISPERSÃO", "depth-scatter-assemble · burst", (st) => {
        st.style.background = "radial-gradient(circle at 50% 45%, #2a1257, #0d0620)";
        const svg = svgEl(445, 260); st.appendChild(svg);
        const pts = DOTS.text("IA", { size: 150, step: 9, cx: 222, cy: 130 });

        const cs = DOTS.draw(svg, pts, { r: 3.3 });
        gsap.set(cs, { transformOrigin: "50% 50%", opacity: 0 });
        const rnd = DOTS.rand(21);
        const sx = pts.map(() => (rnd() - 0.5) * 560), sy = pts.map(() => (rnd() - 0.5) * 340);

        };

      cell("03", "TRAÇO SVG", "svg-path-draw · stroke-dashoffset", (st) => {
        st.style.background = "#f5efe3";
        const svg = svgEl(445, 260); st.appendChild(svg);
        const defs = [
          ["M222,52 C172,52 152,100 177,134 C192,154 197,164 197,180 L247,180 C247,164 252,154 267,134 C292,100 272,52 222,52 Z", "#1a1a1a", 5],
          ["M203,198 L241,198 M208,212 L236,212 M214,226 L230,226", "#1a1a1a", 5],
          ["M222,16 L222,32 M144,62 L156,72 M300,62 L288,72 M116,124 L134,124 M328,124 L310,124", "#ff5a4f", 5],
          ["M60,236 C100,214 130,252 170,232 S250,218 290,238 S360,226 392,236", "#ff5a4f", 4],
        ];
        const ps = defs.map(([d, c, w]) => {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", d); p.setAttribute("pathLength", "1"); p.setAttribute("fill", "none");
          p.setAttribute("stroke", c); p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");

          ps.forEach((p, i) => {

      /* 04 — Texto cinético */
      cell("04", "TEXTO CINÉTICO", "kinetic-beat-slam · gradient-sweep", (st) => {
        const k = mk("div", "k4", '<div class="w">IA</div><div class="w">NÃO</div><div class="w g">ESPERA</div>');

          ws.forEach((w, i) => {
            ft(w, { scale: 2.6, opacity: 0, y: -20 }, { scale: 1, opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, t0 + 0.2 + i * 0.45);

            tl.fromTo(k, { x: 7 }, { x: 0, duration: 0.2, ease: "elastic.out(1,0.3)", immediateRender: false }, t0 + 0.2 + i * 0.45 + 0.28);

      cell("05", "TEXTO 3D", "3d-text-depth-layers · rotateY", (st) => {

          const l = mk("div", "layer", "AGORA"); l.setAttribute("data-layout-allow-overlap", "");

          ft(stack, { rotationY: -42, rotationX: 14 }, { rotationY: 42, rotationX: 14, duration: 2, ease: "sine.inOut" }, t0);

      cell("06", "CONTADOR + BARRAS", "count-up · scaleY stagger", (st) => {

      /* 07 — Voo de câmera sobre grade de pontos */
      cell("07", "CÂMERA 3D", "3d-camera-flight · depth-of-field", (st) => {
        const s = mk("div", "s7", '<div class="glow7"></div><div class="cam"><div class="plane"></div></div>');
        st.appendChild(s);
        const cam = s.querySelector(".cam"), plane = s.querySelector(".plane");
        const orbs = [[70, 150, 22, "#f472b6"], [350, 190, 30, "#38bdf8"]].map(([x, y, r, c]) => {
          const o = mk("div", "orb"); o.style.cssText = `left:${x}px;top:${y}px;width:${r}px;height:${r}px;background:${c};opacity:0`; s.appendChild(o); return o;
        });
        return (t0) => {
          ft(plane, { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 110px", duration: 4, ease: "none" }, t0);
          ft(cam, { rotationZ: -4 }, { rotationZ: 4, duration: 2, ease: "sine.inOut" }, t0);

          orbs.forEach((o, i) => ft(o, { opacity: 0.75 }, { opacity: 0, duration: 0.3 }, t0 + 1.9 + i * 1.7 > t0 + 3.9 ? t0 + 3.7 : t0 + 1.9 + i * 1.7));
        };
      });

      /* 08 — Glitch cromático */
      cell("08", "GLITCH", "chromatic-glitch · scanlines", (st) => {
        const s = mk("div", "s8", '<div class="gt gr" data-layout-allow-overlap>IA MUDA TUDO</div><div class="gt gc" data-layout-allow-overlap>IA MUDA TUDO</div><div class="gt gw" data-layout-allow-overlap>IA MUDA TUDO</div><div class="slice" style="top:70px"></div><div class="slice" style="top:130px"></div><div class="slice" style="top:178px"></div><div class="scan"></div>');
        st.appendChild(s);
        const gr = s.querySelector(".gr"), gc = s.querySelector(".gc"), gw = s.querySelector(".gw"), sl = [...s.querySelectorAll(".slice")];
        const bursts = [[0.6, 14], [0.78, -10], [1.5, 18], [1.62, -14], [2.4, 12], [2.55, -18], [3.3, 20]];
        return (t0) => {
          ft(gw, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t0 + 0.1);
          bursts.forEach(([t, d], i) => {
            const a = t0 + t;
            ft(gr, { x: 0 }, { x: d, duration: 0.05 }, a); tl.to(gr, { x: 0, duration: 0.07 }, a + 0.09);
            ft(gc, { x: 0 }, { x: -d, duration: 0.05 }, a); tl.to(gc, { x: 0, duration: 0.07 }, a + 0.09);
            ft(gw, { skewX: 0 }, { skewX: d * 0.5, duration: 0.04 }, a); tl.to(gw, { skewX: 0, duration: 0.05 }, a + 0.08);
            ft(sl[i % 3], { opacity: 0 }, { opacity: 1, duration: 0.03 }, a); tl.to(sl[i % 3], { opacity: 0, duration: 0.06 }, a + 0.09);
          });
          ft(gw, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.7);
        };
      });

      /* 09 — Pulso reativo à voz (colunas de pontos) */
      cell("09", "PULSO NA VOZ", "áudio-reativo · envelope baked", (st) => {
        const s = mk("div", "s9"); st.appendChild(s);
        const svg = svgEl(445, 260); s.appendChild(svg);
        const COLS = 25, GAP = 12, CY = 132, STEPS = 16;
        const rnd = DOTS.rand(7);
        const env = Array.from({ length: COLS }, (_, c) => Array.from({ length: STEPS }, (_, k) => {
          const mid = 1 - Math.abs(c - (COLS - 1) / 2) / ((COLS - 1) / 2) * 0.65;
          return Math.max(0, Math.round(mid * (0.15 + rnd() * 0.85) * 8));
        }));
        const lines = [];

          const ln = document.createElementNS(NS, "line");

        return (t0) => {
          lines.forEach((ln, c) => {
            for (let k = 0; k < STEPS; k++) {
              const n = env[c][k];
              const prev = k === 0 ? 0 : env[c][k - 1];
              const t = t0 + 0.1 + k * 0.22;
              tl.fromTo(ln, { attr: { y1: CY - prev * GAP, y2: CY + prev * GAP } }, { attr: { y1: CY - n * GAP, y2: CY + n * GAP }, duration: 0.18, ease: "power1.out", immediateRender: false }, t);
            }
            tl.to(ln, { attr: { y1: CY, y2: CY }, duration: 0.3, ease: "power2.in" }, t0 + 3.7);
          });
        };
      });

      /* 10 — Transições (zoom through → blur push) */
      cell("10", "TRANSIÇÕES", "zoom-through · blur-push", (st) => {
        const A = mk("div", "p10", "ANTES"), B = mk("div", "p10", "DEPOIS");
        A.style.background = "linear-gradient(135deg,#1d4ed8,#0ea5e9)"; B.style.background = "linear-gradient(135deg,#be123c,#c2410c)"; A.setAttribute("data-layout-allow-overlap", ""); B.setAttribute("data-layout-allow-overlap", ""); B.setAttribute("data-layout-allow-occlusion", ""); A.setAttribute("data-layout-allow-occlusion", "");
        B.style.opacity = "0";
        const c1 = mk("div", "tcap", "ZOOM THROUGH"), c2 = mk("div", "tcap", "BLUR PUSH");
        st.append(B, A, c1, c2);
        return (t0) => {
          ft(A, { scale: 1, opacity: 1, x: 0, filter: "blur(0px)" }, { scale: 5, opacity: 0, duration: 0.6, ease: "power3.in" }, t0 + 1.2);
          ft(B, { scale: 0.5, opacity: 0, x: 0, filter: "blur(0px)" }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, t0 + 1.2);
          ft(B, { x: 0, opacity: 1, filter: "blur(0px)" }, { x: -140, opacity: 0, filter: "blur(14px)", duration: 0.5, ease: "power2.in" }, t0 + 3.0);
          ft(A, { x: 140, opacity: 0, filter: "blur(14px)", scale: 1 }, { x: 0, opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.5, ease: "power2.out" }, t0 + 3.0);
          ft(c1, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0 + 1.2); ft(c1, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t0 + 2.0);
          ft(c2, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0 + 3.0); ft(c2, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t0 + 3.7);

      /* 11 — Reveal com clip-path */
      cell("11", "REVEAL CLIP-PATH", "clip-path inset · máscara", (st) => {
        const s = mk("div", "s11", '<div class="blk"></div><div class="t11" style="top:62px">SEU</div><div class="t11" style="top:128px">CONTEÚDO</div>');
        st.appendChild(s);
        const blk = s.querySelector(".blk"), ts = [...s.querySelectorAll(".t11")];
        return (t0) => {
          ft(blk, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "expo.inOut" }, t0 + 0.2);
          ft(ts, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out", stagger: 0.15 }, t0 + 0.8);
          ft(ts, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(100% 0% 0% 0%)", duration: 0.4, ease: "power2.in", stagger: 0.08 }, t0 + 2.8);
          ft(blk, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: 0.6, ease: "expo.inOut" }, t0 + 3.2);
        };
      });

      /* 12 — Cards com spring pop */
      cell("12", "SPRING POP", "spring-pop-entrance · back.out", (st) => {
        const s = mk("div", "s12"); st.appendChild(s);
        const data = [["#6366f1", "Novo seguidor", "agora"], ["#ec4899", "Comentário novo", "há 1 min"], ["#f59e0b", "Reel viralizou", "há 3 min"]];
        const cs = data.map(([c, t, m], i) => {
          const e = mk("div", "card", `<i style="background:${c}"></i><div><b>${t}</b><span>${m}</span></div>`);
          e.style.top = 22 + i * 78 + "px"; s.appendChild(e); return e;
        });
        return (t0) => {
          ft(cs, { scale: 0.6, y: 30, x: 0, opacity: 0 }, { scale: 1, y: 0, x: 0, opacity: 1, duration: 0.7, ease: "back.out(2.6)", stagger: 0.15 }, t0 + 0.2);
          ft(cs, { scale: 1, y: 0, x: 0, opacity: 1 }, { scale: 1, y: 0, x: 60, opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.06 }, t0 + 3.2);
        };
      });

      cells.splice(0, cells.length, ...cells.filter((c) => c.n === "06"));

      const fns = cells.map((c, i) => {
        const el = mk("div", "cell"); el.id = "c" + c.n;
        el.style.left = "0px"; el.style.top = "0px";
        const st = mk("div", "st"); el.appendChild(st);
        el.appendChild(mk("div", "lb", `<b><i>${c.n}</i>${c.name}</b><span>${c.tech}</span>`));
        root.appendChild(el);
        return c.build(st);
      });
      for (let k = 0; k < LOOPS; k++) fns.forEach((f) => f(k * L));
      (window.__timelines ||= {})["main"] = tl;
      if (window.self === window.top && !navigator.webdriver) tl.repeat(-1).play();
    </script>
  </body>
</html>
