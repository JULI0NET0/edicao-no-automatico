              <div class="e-cap"><span>RODANDO</span></div>
              <svg class="e-badge" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#F97316" /><path d="M18 33 L28 43 L47 22" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </div>
            <svg id="e-arrow" viewBox="0 0 150 110" fill="none" stroke="#F97316" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path id="e-arrow-line" d="M8 70 C 50 10, 100 10, 138 56" /><path id="e-arrow-head" d="M112 40 L140 58 L118 82" /></svg>
          </div>
        </div>
        <div id="e-edge"></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // lettering: SATISFAÇÃO letter by letter, fitted to the panel width
          var host = document.getElementById("e-w1");
          var text = "SATISFAÇÃO";
          var ctx = document.createElement("canvas").getContext("2d");
          var size = 300;
          var letters = text.split("").map(function (ch) {
            var m = document.createElement("span"); m.className = "e-mask";
            var l = document.createElement("span"); l.className = "e-letter"; l.textContent = ch; l.style.fontSize = size + "px";
            l.setAttribute("data-layout-allow-overlap", ""); l.setAttribute("data-layout-allow-overflow", "");
            m.appendChild(l); host.appendChild(m); return l;
          });
          gsap.set(letters, { yPercent: 105 });
          gsap.set("#e-w2", { opacity: 0 });

          var arrow = document.getElementById("e-arrow-line");
          var alen = arrow.getTotalLength();
          gsap.set(arrow, { strokeDasharray: alen, strokeDashoffset: alen });
          gsap.set("#e-arrow-head", { opacity: 0 });
          gsap.set("#e-arrow", { opacity: 1 });
          gsap.set(["#e-bruto", "#e-edit"], { opacity: 0 });

          // panel enters with the camera drop
          tl.fromTo("#e-panel", { yPercent: -100 }, { yPercent: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, 0);
          tl.fromTo("#e-edge", { y: -866 }, { y: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, 0);
          tl.to("#e-glow", { opacity: 1, duration: 0.6, ease: "sine.out" }, 0.3);

          // SATISFAÇÃO
          letters.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 0.2 + i * 0.04);
          });
          // PURA (serif italic, orange) — slam on the spoken word
          tl.fromTo("#e-w2", { opacity: 0, scale: 1.5, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "expo.out", immediateRender: false }, 1.0);
          tl.fromTo("#e-under", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.12);
          tl.to("#e-glow", { scale: 1.25, duration: 0.5, ease: "expo.out" }, 1.0);

          // exit lettering → bruto/editado
          tl.to("#e-lett", { y: -140, opacity: 0, duration: 0.28, ease: "power3.in" }, 1.6);
          tl.set("#e-be", { opacity: 1 }, 1.8);

          // BRUTO enters (whip from left)
          tl.fromTo("#e-bruto", { opacity: 0, x: -240, rotation: -10 }, { opacity: 1, x: 0, rotation: -4, duration: 0.42, ease: "power4.out", immediateRender: false }, 1.85);
          tl.fromTo("#e-lbl-b", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.05);
          // arrow draws on "ver"
          tl.to(arrow, { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" }, 2.35);
          tl.fromTo("#e-arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, 2.7);
          // EDITADO pops on "rodando"
          tl.fromTo("#e-edit", { opacity: 0, x: 200, scale: 0.86, rotation: 8 }, { opacity: 1, x: 0, scale: 1, rotation: 3, duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, 2.74);
          tl.fromTo("#e-lbl-e", { opacity: 0, y: -14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, 2.9);
          // focus-swap: bruto recedes, editado leads
          tl.to("#e-bruto", { scale: 0.9, opacity: 0.45, filter: "blur(4px)", duration: 0.4, ease: "power2.inOut" }, 3.3);
          tl.to("#e-edit", { scale: 1.06, duration: 0.5, ease: "power2.inOut" }, 3.3);

          window.__timelines = window.__timelines || {};
          window.__timelines["d-letra"] = tl;
        })();
      </script>
