<!DOCTYPE html>
<html lang="pt-BR" data-resolution="landscape-4k">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=3840, height=2160">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 3840px; height: 2160px; overflow: hidden; background: #0A0A0A; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; color: #fff; background: #0A0A0A; }
      #bg { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; }
      #frame { position: absolute; left: 200px; top: 112px; width: 3440px; height: 1935px; border-radius: 36px; overflow: hidden;
        box-shadow: 0 0 0 4px #282828, 0 0 90px rgba(10,10,10,.9); }
      #cam { position: absolute; left: 0; top: 0; width: 3440px; height: 1935px; object-fit: cover; }
      #shade { position: absolute; left: 0; right: 0; bottom: 0; height: 700px;
        background: linear-gradient(to top, rgba(10,10,10,.85), rgba(10,10,10,0)); }
      #wm { position: absolute; right: 110px; top: 100px; width: 170px; height: 170px; opacity: .6; filter: drop-shadow(0 0 18px rgba(10,10,10,.85)) drop-shadow(0 0 6px rgba(10,10,10,.9)); }
      #tag { position: absolute; left: 110px; bottom: 440px; display: flex; align-items: stretch; gap: 36px; padding: 44px 64px 44px 44px; background: rgba(10,10,10,.84); border-radius: 28px; }
      #tag .bar { width: 12px; background: #F97316; border-radius: 6px; }
      #tag .txt { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
      #tag .k { font-size: 48px; font-weight: 700; letter-spacing: .18em; color: #F97316; text-transform: uppercase; }
      #tag .n { font-size: 112px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
      #tag .h { font-size: 52px; font-weight: 500; color: #A8A8A8; }
      #cap { position: absolute; left: 0; right: 0; bottom: 170px; height: 170px; display: flex; justify-content: center; align-items: center; }
      .ph { position: absolute; white-space: nowrap; font-size: 132px; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
      .ph span { display: inline-block; margin: 0 .14em; }
      #prog { position: absolute; left: 0; bottom: 0; height: 10px; width: 3440px; background: #F97316; }
      #end { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; background: #0A0A0A; display: flex; align-items: center; justify-content: center; }
      #end img { width: 1900px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="3840" data-height="2160">
      <img id="bg" class="clip" src="assets/moldura-fundo.png" alt="" data-start="0" data-duration="__VID__" data-track-index="0" />
      <div id="frame">
        <video id="cam" class="clip" src="__VIDEO__" data-start="0" data-duration="__VID__" data-media-start="__T0__" data-track-index="0" playsinline data-has-audio="true"></video>
        <div id="shade" class="clip" data-start="0" data-duration="__VID__" data-track-index="1"></div>
        <img id="wm" class="clip" src="assets/marca-dagua.png" alt="" data-start="0" data-duration="__VID__" data-track-index="2">
        <div id="tag" class="clip" data-start="0.3" data-duration="6.2" data-track-index="3">
          <div class="bar"></div>
          <div class="txt">
            <div class="k">__KICKER__</div>
            <div class="n">__TITULO__</div>
            <div class="h">{{NOME}} · {{HANDLE}}</div>
          </div>
        </div>
        <div id="cap" class="clip" data-start="0" data-duration="__VID__" data-track-index="4"></div>
        <div id="prog" class="clip" data-start="0" data-duration="__VID__" data-track-index="5"></div>
      </div>
      <div id="end" class="clip" data-start="__ENDS__" data-duration="__ENDD__" data-track-index="6"><img id="endlogo" src="assets/logo-fim.png" alt="__TITULO__"></div>
    </div>
    <script>
      const DATA = __DATA__, DUR = __VID__, ENDS = __ENDS__;
      const cap = document.getElementById("cap");
      const tl = gsap.timeline({ paused: true });
      DATA.forEach((p, i) => {
        const el = document.createElement("div"); el.className = "ph"; el.id = "ph" + i;
        p.w.forEach((w, j) => { const s = document.createElement("span"); s.id = `w${i}_${j}`; s.textContent = w.t; s.style.color = "#fff"; el.appendChild(s); });
        cap.appendChild(el);
        tl.set(el, { opacity: 0 }, 0);
        tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, p.s);
        p.w.forEach((w, j) => {
          const sp = `#w${i}_${j}`;
          tl.set(sp, { color: "#F97316" }, w.s);
          const nx = p.w[j + 1]?.s ?? p.e - 0.1;
          tl.set(sp, { color: "#fff" }, Math.max(nx, w.s + 0.12));
        });
        tl.to(el, { opacity: 0, duration: 0.1 }, p.e - 0.1);
      });
      tl.fromTo("#tag .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#tag .txt", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.to("#tag .txt", { opacity: 0, x: -40, duration: 0.4, ease: "power2.in" }, 5.9);
      tl.to("#tag .bar", { scaleY: 0, duration: 0.4, ease: "power2.in" }, 5.9);
      tl.fromTo("#prog", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#bg", { opacity: 0.32 }, { opacity: 0.5, duration: 2.4, ease: "sine.inOut", repeat: Math.ceil(DUR / 2.4), yoyo: true }, 0);
      tl.fromTo("#wm", { opacity: 0 }, { opacity: 0.6, duration: 1, ease: "power1.out" }, 0.8);
      tl.fromTo("#endlogo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, ENDS + 0.35);
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, ENDS);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
