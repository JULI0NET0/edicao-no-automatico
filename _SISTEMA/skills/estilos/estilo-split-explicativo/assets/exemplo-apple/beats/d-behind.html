<!doctype html>
<!--
  Beat D (behind layer) — second poster stage. "DESEJO" waterfalls in, then
  swaps to a yellow "DEMANDA" through the same mask (kinetic-type-swap
  exchange) while a beat-accent burst blooms BEHIND the subject cutout.
  Mounted at global 15.25 — cue constants below are GLOBAL seconds.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #d-stage {
          position: absolute;
          inset: 0;
          opacity: 0;
          background:
            radial-gradient(ellipse 70% 38% at 50% 78%, rgba(249, 115, 22, 0.34), rgba(249, 115, 22, 0) 70%),
            radial-gradient(ellipse 90% 60% at 50% 30%, #1C1C1C 0%, #0A0A0A 60%, #050505 100%);
        }
        #d-burst {
          position: absolute;
          left: -160px;
          top: 260px;
          width: 1400px;
          height: 1400px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(255, 190, 140, 0.9) 0%,
            rgba(249, 115, 22, 0.55) 18%,
            rgba(249, 115, 22, 0.18) 40%,
            rgba(249, 115, 22, 0) 66%
          );
          opacity: 0;
        }
        #d-ring {
          position: absolute;
          left: 190px;
          top: 610px;
          width: 700px;
          height: 700px;
          border-radius: 50%;
          border: 10px solid rgba(249, 115, 22, 0.9);
          opacity: 0;
        }
        #d-kicker {
          position: absolute;
          left: 0;
          width: 1080px;
          top: 40px;
          text-align: center;
          font-family: "Montserrat", sans-serif;
          font-weight: 800;
          font-size: 30px;
          letter-spacing: 0.34em;
          color: rgba(255, 255, 255, 0.55);
          opacity: 0;
        }
        .d-word {
          position: absolute;
          left: 0;
          top: 70px;
          width: 1080px;
          display: flex;
          justify-content: center;
          transform-origin: 50% 0%;
        }
        .d-mask {
          display: inline-block;
          overflow: hidden;
          padding: 0 2px;
        }
        .d-letter {
          display: inline-block;
          font-family: "League Gothic", sans-serif;
          font-weight: 400;
          line-height: 0.92;
          color: #FFFFFF;
          text-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }
        #d-w2 .d-letter {
          color: #F97316;
          text-shadow: 0 0 40px rgba(249, 115, 22, 0.45), 0 18px 50px rgba(0, 0, 0, 0.55);
        }
      </style>
      <div id="root" data-composition-id="d-behind" data-width="1080" data-height="1920">
        <div id="d-stage">
          <div id="d-burst"></div>
          <div id="d-ring"></div>
          <div id="d-kicker">MUITO BONS EM GERAR</div>
          <div class="d-word" id="d-w1"></div>
          <div class="d-word" id="d-w2"></div>
        </div>
      </div>
      <script>
        (function () {
          var OFFSET = 15.25;
          var T = function (g) {
            return g - OFFSET;
          };
          var CUT = 15.28;
          var HIT = 16.16; // "demanda"
          var EXIT = 17.3;

          var ctx = document.createElement("canvas").getContext("2d");
          function build(hostId, word) {
            var host = document.getElementById(hostId);
            var size = 900;
            while (size > 200) {
              ctx.font = "400 " + size + "px \"League Gothic\"";
              if (ctx.measureText(word).width + word.length * 4 <= 1020) break;
              size -= 4;
            }
            size = Math.min(size, 470);
            return word.split("").map(function (ch) {
              var m = document.createElement("span");
              m.className = "d-mask";
              var l = document.createElement("span");
              l.className = "d-letter";
              l.textContent = ch;
              l.style.fontSize = size + "px";
              m.appendChild(l);
              host.appendChild(m);
              return l;
            });
          }
          var w1 = build("d-w1", "DESEJO");
          var w2 = build("d-w2", "DEMANDA");

          var tl = gsap.timeline({ paused: true });
          gsap.set([w1, w2], { yPercent: 105 });
          gsap.set(w2, { opacity: 0 });
          gsap.set(".d-word", { scaleY: 1.08 });

          tl.set("#d-stage", { opacity: 1 }, T(CUT));
          tl.fromTo("#d-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T(CUT + 0.03));
          w1.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.26, ease: "power4.out", immediateRender: false }, T(CUT + 0.02 + i * 0.03));
          });
          // Masked exchange: DESEJO whips up and out, DEMANDA slams up in.
          w1.forEach(function (l, i) {
            tl.to(l, { yPercent: -110, duration: 0.14, ease: "power4.in" }, T(HIT - 0.16 + i * 0.015));
          });
          tl.set(w1, { opacity: 0 }, T(HIT + 0.1));
          tl.set(w2, { opacity: 1 }, T(HIT - 0.03));
          w2.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.22, ease: "back.out(1.6)", immediateRender: false }, T(HIT - 0.02 + i * 0.025));
          });
          // beat-accent burst behind the subject.
          tl.fromTo("#d-burst", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.1, ease: "expo.out", immediateRender: false }, T(HIT));
          tl.to("#d-burst", { opacity: 0.25, scale: 1.2, duration: 0.8, ease: "power2.out" }, T(HIT + 0.1));
          tl.fromTo("#d-ring", { opacity: 0.95, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "expo.out", immediateRender: false }, T(HIT));
          tl.set("#d-stage", { opacity: 0 }, T(EXIT));

          window.__timelines = window.__timelines || {};
          window.__timelines["d-behind"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
