        const phn = mkdv(78, 150, 326, 68, "linear-gradient(135deg,#10b981,#3b82f6)");
        return (t0) => {
          ft(tab, { x: 120, scale: 0.9, rotation: 0, opacity: 0 }, { x: 0, scale: 1, rotation: -6, opacity: 1, duration: 0.8, ease: "power3.out" }, t0 + 0.3);
          ft(phn, { x: -230, scale: 0.9, rotation: 0, opacity: 0 }, { x: 0, scale: 1, rotation: 6, opacity: 1, duration: 0.8, ease: "power3.out" }, t0 + 0.3);
          ft(dsk, { scale: 0.7, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, t0 + 0.1);
          ft([tab, phn], { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6);
          ft(dsk, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6);
        };
      });

      /* 09 — Notas */
      cell("09", "APP DE NOTAS", "notes-typing · checklist", (st) => {
        const s = mk("div", "s9", '<div class="nh"></div>'); st.appendChild(s);
        const nh = s.querySelector(".nh");
        const items = ["Gravar o Reel", "Cortar silêncios", "Legenda karaokê", "Publicar às 19h"];
        const ls = items.map((t, i) => { const l = mk("div", "nl"); l.style.top = 74 + i * 38 + "px"; l.style.left = "58px"; const c = mk("div", "ck"); c.style.top = 76 + i * 38 + "px"; s.append(l, c); return { l, c, t }; });
        return (t0) => {
          typeTo(nh, "Hoje ✍️", t0 + 0.1, 0.4);
          ls.forEach(({ l, c, t }, i) => {
            typeTo(l, t, t0 + 0.6 + i * 0.5, 0.45);
            ft(c, { backgroundColor: "#fff7d6" }, { backgroundColor: "#f59e0b", duration: 0.2 }, t0 + 2.0 + i * 0.4);
            ft(l, { opacity: 1 }, { opacity: 0.45, duration: 0.2 }, t0 + 2.0 + i * 0.4);
          });
          ls.forEach(({ l, c }) => { tl.set(l, { textContent: "", opacity: 1 }, t0 + 3.95); tl.set(c, { backgroundColor: "#fff7d6" }, t0 + 3.95); });
          tl.set(nh, { textContent: "" }, t0 + 3.95);
        };
      });

      /* 10 — Mapa com arco */
      cell("10", "MAPA + ARCO", "world-map · us-map-flow", (st) => {
        const s = mk("div", "s10"); st.appendChild(s);
        const svg = svgEl(445, 260); s.appendChild(svg);
        const land = ["M40,70 C70,40 140,40 170,70 C190,100 170,140 140,150 C110,170 90,150 70,130 C45,115 30,95 40,70 Z", "M250,60 C290,40 350,45 395,75 C415,105 400,150 365,165 C330,185 300,170 285,140 C265,115 235,85 250,60 Z", "M190,185 C215,175 245,185 250,210 C245,235 215,240 195,225 C180,210 180,195 190,185 Z"];
        land.forEach((d) => DOTS.draw(svg, DOTS.fill(d, { step: 9 }), { r: 2.1, color: "#3b82f6", opacity: 0.55 }));
        const A = { x: 110, y: 105 }, B = { x: 340, y: 105 }, C = { x: 215, y: 205 };
        const arc = (p, q, h) => `M${p.x},${p.y} Q${(p.x + q.x) / 2},${Math.min(p.y, q.y) - h} ${q.x},${q.y}`;
        const mkp = (d, col) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("pathLength", "1"); p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", 2.5); p.setAttribute("stroke-linecap", "round"); p.style.strokeDasharray = "1 1"; p.style.strokeDashoffset = "1"; svg.appendChild(p); return p; };
        const p1 = mkp(arc(A, B, 90), "#fbbf24"), p2 = mkp(arc(B, C, 20), "#f472b6"), p3 = mkp(arc(C, A, 20), "#34d399");
        const pin = (q, col) => { const g = document.createElementNS(NS, "circle"); g.setAttribute("cx", q.x); g.setAttribute("cy", q.y); g.setAttribute("r", 5); g.setAttribute("fill", col); svg.appendChild(g); const r = document.createElementNS(NS, "circle"); r.setAttribute("cx", q.x); r.setAttribute("cy", q.y); r.setAttribute("r", 5); r.setAttribute("fill", "none"); r.setAttribute("stroke", col); r.setAttribute("stroke-width", 2); svg.appendChild(r); return [g, r]; };
        const pins = [pin(A, "#fbbf24"), pin(B, "#f472b6"), pin(C, "#34d399")];
        return (t0) => {
          pins.forEach(([g, r], i) => { ft(g, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t0 + 0.2 + i * 0.7); ft(r, { scale: 1, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 4, opacity: 0, duration: 0.9, ease: "power2.out" }, t0 + 0.3 + i * 0.7); });
          [p1, p2, p3].forEach((p, i) => { ft(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, t0 + 0.4 + i * 0.7); ft(p, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6); });
          pins.forEach(([g, r]) => ft(g, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6));
        };
      });

      /* 11 — Antes e depois */
      cell("11", "ANTES / DEPOIS", "before-after-wipe · comparison-split", (st) => {
        const s = mk("div", "s11"); st.appendChild(s);
        const bef = mk("div", "pan", "BRUTO"); bef.style.cssText = "background:linear-gradient(135deg,#52525b,#27272a);color:#fff;filter:saturate(0)";
        const aft = mk("div", "pan", "EDITADO"); aft.style.cssText = "background:linear-gradient(135deg,#be123c,#b45309 55%,#0e7490);color:#fff;clip-path:inset(0 100% 0 0)";
        const l1 = mk("div", "pl", "ANTES"); l1.style.left = "12px"; const l2 = mk("div", "pl", "DEPOIS"); l2.style.right = "12px";
        const bar = mk("div", "a"); bar.style.cssText = "left:0;top:0;width:3px;height:260px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8)";
        const knob = mk("div", "a"); knob.style.cssText = "left:-11px;top:119px;width:25px;height:25px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:11px;font-weight:900"; 
        bar.appendChild(knob); s.append(bef, aft, l1, l2, bar); [bef, aft, l1, l2, bar, knob].forEach((e) => { e.setAttribute("data-layout-allow-overlap", ""); e.setAttribute("data-layout-allow-occlusion", ""); });
        return (t0) => {
          ft(aft, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.4, ease: "power2.inOut" }, t0 + 0.4);
          ft(bar, { x: 0 }, { x: 445, duration: 1.4, ease: "power2.inOut" }, t0 + 0.4);
          ft(aft, { clipPath: "inset(0 0% 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 1.2, ease: "power2.inOut" }, t0 + 2.4);
          ft(bar, { x: 445 }, { x: 0, duration: 1.2, ease: "power2.inOut" }, t0 + 2.4);
        };
      });

      /* 12 — Liquid glass */
      cell("12", "LIQUID GLASS", "liquid-glass-widgets · aurora", (st) => {
        const s = mk("div", "s12"); st.appendChild(s);
        const mb = (l, t, w, c) => { const b = mk("div", "bl"); b.style.cssText = `left:${l}px;top:${t}px;width:${w}px;height:${w}px;background:${c}`; s.appendChild(b); return b; };
        const b1 = mb(20, 20, 170, "#7c3aed"), b2 = mb(240, 60, 190, "#06b6d4"), b3 = mb(130, 140, 150, "#ec4899");
        const g1 = mk("div", "gl", "<b>12,4k</b><span>ALCANCE</span>"); g1.style.cssText = "left:34px;top:40px;width:170px;height:92px";
        const g2 = mk("div", "gl", "<b>+38%</b><span>CRESCIMENTO</span>"); g2.style.cssText = "left:236px;top:84px;width:170px;height:92px";
        const g3 = mk("div", "gl"); g3.style.cssText = "left:92px;top:176px;width:262px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.16em"; g3.textContent = "IA · EDIÇÃO · CONTEÚDO";
        s.append(g1, g2, g3);
        return (t0) => {
          ft(b1, { x: 0, y: 0 }, { x: 90, y: 40, duration: 2, ease: "sine.inOut" }, t0); ft(b1, { x: 90, y: 40 }, { x: 0, y: 0, duration: 2, ease: "sine.inOut" }, t0 + 2);
          ft(b2, { x: 0, y: 0 }, { x: -80, y: 50, duration: 2, ease: "sine.inOut" }, t0); ft(b2, { x: -80, y: 50 }, { x: 0, y: 0, duration: 2, ease: "sine.inOut" }, t0 + 2);
          ft(b3, { x: 0, y: 0 }, { x: 70, y: -40, duration: 2, ease: "sine.inOut" }, t0); ft(b3, { x: 70, y: -40 }, { x: 0, y: 0, duration: 2, ease: "sine.inOut" }, t0 + 2);
          [g1, g2, g3].forEach((g, i) => {
            ft(g, { y: 30, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, t0 + 0.2 + i * 0.2);
            ft(g, { y: 0 }, { y: -7, duration: 1.4, ease: "sine.inOut" }, t0 + 1.0 + i * 0.1);
            ft(g, { y: -7 }, { y: 0, duration: 1.4, ease: "sine.inOut" }, t0 + 2.4 + i * 0.05 > t0 + 3.5 ? t0 + 3.5 : t0 + 2.4 + i * 0.05);
            ft(g, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.75);
          });
        };
      });

      cells.splice(0, cells.length, ...cells.filter((c) => c.n === "11"));

      const fns = cells.map((c, i) => {
        const el = mk("div", "cell"); el.id = "c" + c.n;
        el.style.left = "0px"; el.style.top = "0px";
        const st = mk("div", "st"); el.appendChild(st);
        el.appendChild(mk("div", "lb", `<b><i>${c.n}</i>${c.name}</b><span>${c.tech}</span>`));
        root.appendChild(el);
        return c.build(st);
      });
      for (let k = 0; k < LOOPS; k++) fns.forEach((f) => f(k * L));
      (window.__timelines ||= {})["main"] = tl;
      if (window.self === window.top && !navigator.webdriver) tl.repeat(-1).play();
    </script>
  </body>
