<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=445, height=300" />
    <title>moodboard-3d · célula 04</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; background: #0b0b0f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0f; font-family: Montserrat, sans-serif; color: #fff; }
      .hd { position: absolute; left: 40px; top: 38px; font-weight: 800; font-size: 22px; letter-spacing: 0.22em; }
      .hd2 { position: absolute; right: 40px; top: 42px; font-weight: 600; font-size: 14px; letter-spacing: 0.18em; color: #8a8a96; }
      .cell { position: absolute; width: 445px; height: 300px; border-radius: 14px; overflow: hidden; background: transparent; }
      .st { position: absolute; left: 0; top: 0; width: 445px; height: 260px; overflow: hidden; }
      .lb { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #15151c; }
      .lb b { font-weight: 800; font-size: 13px; letter-spacing: 0.14em; }
      .lb b i { font-style: normal; color: #8a8a96; margin-right: 8px; }
      .lb span { font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #8a8a96; }
      .a { position: absolute; }
      .p3 { position: absolute; inset: 0; perspective: 700px; perspective-origin: 50% 45%; }
      .s3 { position: absolute; transform-style: preserve-3d; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
      /* phone */
      .face { position: absolute; inset: 0; border-radius: 26px; }
      .scr { position: absolute; left: 6px; top: 6px; right: 6px; bottom: 6px; border-radius: 21px; overflow: hidden; background: linear-gradient(160deg, #6d28d9, #db2777 60%, #f97316); }
      .ic { position: absolute; width: 20px; height: 20px; border-radius: 6px; }
      /* mac */
      .key { background: repeating-linear-gradient(90deg, #cbd5e1 0 14px, #94a3b8 14px 15px), #cbd5e1; }
      /* code */
      .cb { position: absolute; height: 7px; border-radius: 4px; transform-origin: 0 50%; }
      /* shards */
      .sh { position: absolute; left: 0; top: 0; width: 445px; height: 260px; }
      .sh img, .full { position: absolute; left: 0; top: 0; width: 445px; height: 260px; object-fit: cover; object-position: 50% 14%; display: block; }
    </style>
    <style>#root { width: 445px !important; height: 300px !important; }</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="445" data-height="300">
    </div>
    <script>
      const root = document.getElementById("root");
      const L = 4, LOOPS = 3;
      const tl = gsap.timeline({ paused: true });
      const ft = (tg, a, b, p) => tl.fromTo(tg, a, { ...b, immediateRender: false }, p);
      const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
      const allow = (e) => { ["overlap", "occlusion", "overflow"].forEach((k) => e.setAttribute("data-layout-allow-" + k, "")); return e; };
      const cells = [];
      const cell = (n, name, tech, bg, build) => cells.push({ n, name, tech, bg, build });
      const sine = (el, prop, a, b, t0, d) => { ft(el, { [prop]: a }, { [prop]: b, duration: d, ease: "sine.inOut" }, t0); ft(el, { [prop]: b }, { [prop]: a, duration: d, ease: "sine.inOut" }, t0 + d); };

      /* 01 — iPhone 3D */
      cell("01", "IPHONE 3D", "ios26-liquid-glass (CSS 3D)", "radial-gradient(circle at 50% 40%, #27272a, #09090b)", (st) => {
        const p3 = mk("div", "p3"); st.appendChild(p3);
        const ph = mk("div", "s3"); ph.style.cssText = "left:167px;top:16px;width:110px;height:228px";
        for (let k = 0; k < 7; k++) { const e = mk("div", "face"); e.style.cssText = `background:${k % 2 ? "#3f3f46" : "#27272a"};transform:translateZ(${-k * 2}px)`; ph.appendChild(e); }
        const front = mk("div", "face"); front.style.cssText = "background:#09090b;transform:translateZ(5px);border:2px solid #52525b";
        const scr = mk("div", "scr"); front.appendChild(scr);
        scr.appendChild(Object.assign(mk("div", "a"), { innerHTML: "9:41" }));
        scr.firstChild.style.cssText = "left:0;right:0;top:26px;text-align:center;font-weight:800;font-size:26px";
        const cols = ["#22c55e", "#3b82f6", "#facc15", "#ef4444", "#a855f7", "#14b8a6", "#f97316", "#ec4899"];
        cols.forEach((c, i) => { const ic = mk("div", "ic"); ic.style.cssText = `background:${c};left:${12 + (i % 4) * 22}px;top:${96 + Math.floor(i / 4) * 30}px;width:18px;height:18px`; scr.appendChild(ic); });
        const notch = mk("div", "a"); notch.style.cssText = "left:36px;top:8px;width:32px;height:9px;border-radius:5px;background:#000"; scr.appendChild(notch);
        ph.appendChild(front); p3.appendChild(ph);
        return (t0) => { ft(ph, { rotationY: -42, rotationX: 8 }, { rotationY: 42, rotationX: 8, duration: 2, ease: "sine.inOut" }, t0); ft(ph, { rotationY: 42 }, { rotationY: -42, duration: 2, ease: "sine.inOut" }, t0 + 2); };
      });

      /* 02 — MacBook abrindo */
      cell("02", "MACBOOK 3D", "macos-tahoe-liquid-glass (CSS 3D)", "linear-gradient(160deg, #1e293b, #0f172a)", (st) => {
        const p3 = mk("div", "p3"); p3.style.perspectiveOrigin = "50% 30%"; st.appendChild(p3);
        const rig = mk("div", "s3"); rig.style.cssText = "left:92px;top:60px;width:260px;height:170px";
        const base = mk("div", "a key"); base.style.cssText = "left:0;top:112px;width:260px;height:96px;border-radius:8px;transform-origin:50% 0;transform:rotateX(80deg);box-shadow:0 0 0 2px #64748b";
        const lid = mk("div", "s3"); lid.style.cssText = "left:15px;top:112px;width:230px;height:140px;transform-origin:50% 100%;margin-top:-140px";
        const back = mk("div", "a"); back.style.cssText = "inset:0;border-radius:8px;background:#94a3b8;transform:rotateY(180deg)";
        const scr = mk("div", "a"); scr.style.cssText = "inset:0;border-radius:8px;border:5px solid #0f172a;background:linear-gradient(135deg,#38bdf8,#6366f1 55%,#ec4899);overflow:hidden";
        scr.innerHTML = '<div class="a" style="left:12px;top:10px;width:90px;height:60px;border-radius:8px;background:rgba(255,255,255,.35)"></div><div class="a" style="left:112px;top:30px;width:90px;height:70px;border-radius:8px;background:rgba(255,255,255,.25)"></div>';
        lid.append(back, scr); rig.append(lid, base); p3.appendChild(rig);
        return (t0) => {
          ft(lid, { rotationX: 84 }, { rotationX: -6, duration: 1.3, ease: "power3.out" }, t0 + 0.2);
          ft(rig, { rotationY: -22 }, { rotationY: 22, duration: 3, ease: "sine.inOut" }, t0 + 0.4);
          ft(lid, { rotationX: -6 }, { rotationX: 84, duration: 0.5, ease: "power2.in" }, t0 + 3.4);
          ft(rig, { rotationY: 22 }, { rotationY: -22, duration: 0.5 }, t0 + 3.5);
        };
      });

      /* 03 — Janela de código inclinada */
      cell("03", "CÓDIGO 3D", "code-3d-extrude (CSS 3D)", "radial-gradient(circle at 70% 30%, #1e1b4b, #020617)", (st) => {
        const p3 = mk("div", "p3"); st.appendChild(p3);
        const w = mk("div", "s3"); w.style.cssText = "left:70px;top:36px;width:305px;height:190px";
        for (let k = 0; k < 6; k++) { const e = mk("div", "a"); e.style.cssText = `inset:0;border-radius:10px;background:${k === 0 ? "#312e81" : "#1e1b4b"};transform:translateZ(${-k * 3}px)`; w.appendChild(e); }
        const f = mk("div", "a"); f.style.cssText = "inset:0;border-radius:10px;background:#0f172a;border:1px solid #6366f1;transform:translateZ(4px);box-shadow:0 0 30px rgba(99,102,241,.5)";
        f.innerHTML = '<div class="a" style="left:12px;top:10px;width:9px;height:9px;border-radius:50%;background:#f87171"></div><div class="a" style="left:28px;top:10px;width:9px;height:9px;border-radius:50%;background:#fbbf24"></div><div class="a" style="left:44px;top:10px;width:9px;height:9px;border-radius:50%;background:#34d399"></div>';
        const cols = ["#f472b6", "#60a5fa", "#fbbf24", "#34d399", "#c084fc", "#fb7185"];
        const bars = [];
        for (let i = 0; i < 10; i++) { let x = 18 + (i % 3 === 1 ? 24 : 0); for (let j = 0; j < 3; j++) { const wd = 24 + ((i * 13 + j * 29) % 56); const b = mk("div", "cb"); b.style.cssText = `left:${x}px;top:${36 + i * 15}px;width:${wd}px;background:${cols[(i + j * 2) % 6]}`; f.appendChild(b); bars.push(b); x += wd + 8; } }
        const hl = mk("div", "a"); hl.style.cssText = "left:0;right:0;top:94px;height:15px;background:rgba(129,140,248,.28);opacity:0"; f.appendChild(hl);
        w.appendChild(f); p3.appendChild(w);
        return (t0) => {
          ft(w, { rotationY: -30, rotationX: 10 }, { rotationY: 24, rotationX: 4, duration: 3.6, ease: "sine.inOut" }, t0);
          ft(bars, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out", stagger: 0.05 }, t0 + 0.3);
          ft(hl, { opacity: 0, y: -40 }, { opacity: 1, y: 60, duration: 1.4, ease: "sine.inOut" }, t0 + 1.8);
          ft([bars], { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.65);
          tl.set(bars, { opacity: 1, scaleX: 0 }, t0 + 3.97); tl.set(hl, { opacity: 0 }, t0 + 3.97);
        };
      });

      /* 04, 05 e 09 — Three.js (preenchidos pelo módulo) */
      cell("04", "PARTÍCULAS 3D", "code-particle-assemble (Three.js)", "transparent", () => () => {});
      cell("05", "ÓRBITA + CARD", "orbit-card (Three.js)", "transparent", () => () => {});

      /* 06 — Câmera mergulha na tela do celular */
      cell("06", "DEVICE DIVE", "parallax-device-dive", "#111827", (st) => {
        const bg = mk("img", "full"); bg.src = "../_fontes/moodboard-3d/assets/ffim_8.jpg"; bg.alt = ""; st.appendChild(bg); bg.style.filter = "brightness(.5)";
        const ph = mk("div", "a"); ph.style.cssText = "left:160px;top:20px;width:125px;height:220px;border-radius:24px;background:#09090b;border:3px solid #3f3f46;transform-origin:50% 48%;overflow:hidden";
        const im = mk("img"); im.src = "../_fontes/moodboard-3d/assets/f2612_5.jpg"; im.alt = ""; im.style.cssText = "position:absolute;left:5px;top:5px;width:109px;height:200px;object-fit:cover;object-position:50% 16%;border-radius:19px";
        ph.appendChild(im); st.appendChild(ph);
        return (t0) => {
          ft(ph, { y: 80, scale: 0.7, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, t0 + 0.1);
          ft(ph, { scale: 1 }, { scale: 8.5, duration: 1.2, ease: "power3.in" }, t0 + 1.2);
          ft(ph, { scale: 8.5 }, { scale: 1, duration: 0.8, ease: "power3.out" }, t0 + 2.8);
        };
      });

      /* 07 — Pilha de cards com profundidade */
      cell("07", "DEPTH STACK", "camera-rig-depth-stack", "linear-gradient(135deg,#0f172a,#1e1b4b)", (st) => {
        const p3 = mk("div", "p3"); p3.style.perspective = "600px"; st.appendChild(p3);
        const rig = mk("div", "s3"); rig.style.cssText = "left:107px;top:50px;width:230px;height:150px"; p3.appendChild(rig);
        const defs = [["#f43f5e", "#fb923c"], ["#8b5cf6", "#ec4899"], ["#0ea5e9", "#22d3ee"], ["#10b981", "#84cc16"]];
        const cs = defs.map(([a, b], i) => { const c = mk("div", "a"); c.style.cssText = `inset:0;border-radius:14px;background:linear-gradient(135deg,${a},${b});transform:translateZ(${-i * 70}px) translateX(${i * 18}px) translateY(${-i * 10}px);box-shadow:0 10px 24px rgba(0,0,0,.4)`; rig.appendChild(c); return c; });
        const img = mk("img"); img.src = "../_fontes/moodboard-3d/assets/f0433_5.jpg"; img.alt = ""; img.style.cssText = "position:absolute;left:0;top:0;width:230px;height:150px;object-fit:cover;object-position:50% 14%;border-radius:14px"; cs[0].appendChild(img);
        return (t0) => {
          ft(rig, { rotationY: -24, rotationX: 6 }, { rotationY: 24, rotationX: -4, duration: 2, ease: "sine.inOut" }, t0);
          ft(rig, { rotationY: 24, rotationX: -4 }, { rotationY: -24, rotationX: 6, duration: 2, ease: "sine.inOut" }, t0 + 2);
          cs.forEach((c, i) => ft(c, { opacity: 0.2 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, t0 + 0.1 + (3 - i) * 0.2));
          tl.set(cs, { opacity: 0.2 }, t0 + 3.97);
        };
      });

      /* 08 — Tilt card com camadas */
      cell("08", "TILT CARD", "tilt-card · depth layers", "linear-gradient(135deg,#1e1b4b,#581c87)", (st) => {
        const p3 = mk("div", "p3"); st.appendChild(p3);
        const card = mk("div", "s3"); card.style.cssText = "left:112px;top:46px;width:220px;height:168px";
        const bgc = mk("div", "a"); bgc.style.cssText = "inset:0;border-radius:18px;background:linear-gradient(135deg,#f472b6,#8b5cf6 60%,#3b82f6);box-shadow:0 20px 40px rgba(0,0,0,.45)";
        const orb = mk("div", "a"); orb.style.cssText = "left:120px;top:20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff7ae,#fb923c);transform:translateZ(30px)";
        const pro = mk("div", "a", "PRO"); pro.style.cssText = "left:20px;bottom:18px;font-weight:900;font-size:46px;letter-spacing:-0.02em;transform:translateZ(60px);text-shadow:0 6px 12px rgba(0,0,0,.35)";
        const glare = mk("div", "a"); glare.style.cssText = "inset:0;border-radius:18px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);transform:translateZ(80px);opacity:.8;overflow:hidden";
        card.append(bgc, orb, pro, glare); p3.appendChild(card);
        return (t0) => {
          ft(card, { rotationY: -22, rotationX: 14 }, { rotationY: 22, rotationX: -10, duration: 2, ease: "sine.inOut" }, t0);
          ft(card, { rotationY: 22, rotationX: -10 }, { rotationY: -22, rotationX: 14, duration: 2, ease: "sine.inOut" }, t0 + 2);
          ft(glare, { backgroundPosition: "-220px 0" }, { backgroundPosition: "220px 0", duration: 2, ease: "sine.inOut" }, t0);
          ft(glare, { backgroundPosition: "220px 0" }, { backgroundPosition: "-220px 0", duration: 2, ease: "sine.inOut" }, t0 + 2);
        };
      });

      cell("09", "LIQUID SHADER", "vfx-liquid-background (GLSL)", "transparent", () => () => {});

      /* 10 — Flare anamórfico */
      cell("10", "ANAMORPHIC FLARE", "vfx-anamorphic-flare", "#02030a", (st) => {
        const pts = [[60, 70, 0.9], [140, 150, 1.2], [230, 100, 0.7], [320, 180, 1.0], [380, 60, 1.3], [110, 215, 0.8], [290, 30, 0.6]];
        const els = pts.map(([x, y, s], i) => { const g = mk("div", "a"); g.style.cssText = `left:${x - 90}px;top:${y - 6}px;width:180px;height:12px`; g.innerHTML = `<div class="a" style="left:0;top:5px;width:180px;height:2px;background:linear-gradient(90deg,transparent,#60a5fa 45%,#fff 50%,#60a5fa 55%,transparent)"></div><div class="a" style="left:84px;top:0;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,#93c5fd 60%,transparent 72%)"></div>`; st.appendChild(g); return { g, s, i }; });
        return (t0) => {
          els.forEach(({ g, s, i }) => {
            ft(g, { x: -30 * s, scaleX: 0.6 * s, opacity: 0.35 }, { x: 30 * s, scaleX: 1.1 * s, opacity: 1, duration: 2, ease: "sine.inOut" }, t0 + i * 0.1);
            ft(g, { x: 30 * s, scaleX: 1.1 * s, opacity: 1 }, { x: -30 * s, scaleX: 0.6 * s, opacity: 0.35, duration: 2, ease: "sine.inOut" }, t0 + 2 + i * 0.05 > t0 + 3.9 ? t0 + 3.9 : t0 + 2 + i * 0.05);
          });
        };
      });

      /* 11 — Estilhaçar imagem */
      cell("11", "SHATTER", "vfx-shatter (clip-path)", "#09090b", (st) => {
        const COLS = 4, ROWS = 3, shards = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const x0 = (c / COLS) * 100, x1 = ((c + 1) / COLS) * 100, y0 = (r / ROWS) * 100, y1 = ((r + 1) / ROWS) * 100;
          [[`${x0}% ${y0}%, ${x1}% ${y0}%, ${x1}% ${y1}%`, 0], [`${x0}% ${y0}%, ${x1}% ${y1}%, ${x0}% ${y1}%`, 1]].forEach(([poly, h]) => {
            const s = mk("div", "sh", '<img src="../_fontes/moodboard-3d/assets/f0433_5.jpg" alt="" />'); s.style.clipPath = `polygon(${poly})`; st.appendChild(s);
            const idx = shards.length; const ccx = (c + 0.5 - COLS / 2), ccy = (r + 0.5 - ROWS / 2);
            shards.push({ s, dx: ccx * 150 + (((idx * 37) % 11) - 5) * 14, dy: ccy * 130 + (((idx * 53) % 9) - 4) * 14, rot: (((idx * 29) % 13) - 6) * 14, d: ((idx * 7919) % 24) / 24 * 0.25 });
          });
        }
        return (t0) => shards.forEach(({ s, dx, dy, rot, d }) => {
          ft(s, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 }, { x: dx, y: dy, rotation: rot, scale: 0.8, opacity: 0, duration: 1.0, ease: "power3.in" }, t0 + 0.9 + d);
          ft(s, { x: dx, y: dy, rotation: rot, scale: 0.8, opacity: 0 }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, t0 + 2.7 + d);
        });
      });

      /* 12 — Portal */
      cell("12", "PORTAL", "vfx-portal (conic + glow)", "radial-gradient(circle at 50% 50%, #1e1b4b, #020617)", (st) => {
        const inner = mk("div", "a"); inner.style.cssText = "left:137px;top:40px;width:170px;height:170px;border-radius:50%;overflow:hidden;transform-origin:50% 50%";
        const im = mk("img", "full"); im.src = "../_fontes/moodboard-3d/assets/f2612_5.jpg"; im.alt = ""; im.style.cssText = "position:absolute;left:-40px;top:0;width:250px;height:190px;object-fit:cover;object-position:50% 16%"; inner.appendChild(im);
        const ring = mk("div", "a"); ring.style.cssText = "left:127px;top:30px;width:190px;height:190px;border-radius:50%;background:conic-gradient(from 0deg,#f97316,#ec4899,#8b5cf6,#22d3ee,#f97316);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);box-shadow:0 0 40px rgba(236,72,153,.6);filter:blur(0.4px)";
        const glow = mk("div", "a"); glow.style.cssText = "left:107px;top:10px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.5),transparent 68%)";
        st.append(glow, inner, ring);
        return (t0) => {
          ft(ring, { rotation: 0 }, { rotation: 270, duration: 4, ease: "none" }, t0);
          ft(ring, { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(1.6)" }, t0 + 0.1);
          ft(inner, { scale: 0 }, { scale: 1, duration: 0.9, ease: "back.out(1.5)" }, t0 + 0.3);
          ft(glow, { scale: 0.6, opacity: 0.3 }, { scale: 1.1, opacity: 1, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0 + 0.2);
          ft(inner, { scale: 1 }, { scale: 0, duration: 0.5, ease: "power2.in" }, t0 + 3.4);
          ft(ring, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.65);
          tl.set(ring, { opacity: 1 }, t0 + 3.97);
        };
      });

      cells.splice(0, cells.length, ...cells.filter((c) => c.n === "04"));

      const fns = cells.map((c, i) => {
        const el = mk("div", "cell"); el.id = "c" + c.n;
        el.style.left = "0px"; el.style.top = "0px";
        const st = mk("div", "st"); st.style.background = c.bg; el.appendChild(st);
        el.appendChild(mk("div", "lb", `<b><i>${c.n}</i>${c.name}</b><span>${c.tech}</span>`));
        root.appendChild(el);
        const f = c.build(st);
        st.querySelectorAll("*").forEach((n) => { if (n.tagName.toLowerCase() !== "canvas") allow(n); });
        return f;
      });
      for (let k = 0; k < LOOPS; k++) fns.forEach((f) => f(k * L));
      const canvas = document.createElement("canvas"); canvas.id = "gl";  canvas.width = 1920; canvas.height = 1080; root.prepend(canvas);
      (window.__timelines ||= {})["main"] = tl;
      if (window.self === window.top && !navigator.webdriver) tl.repeat(-1).play();
    </script>
    <script type="module">
      import * as THREE from "three";
      const W = 1920, H = 1080, CW = 445, CH = 260;
      const cellPos = (i) => ({ x: 40 + (i % 4) * 465, y: 100 + Math.floor(i / 4) * 320 });
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setScissorTest(true); renderer.autoClear = false;
      const tex = new THREE.TextureLoader().load("../_fontes/moodboard-3d/assets/f0433_5.jpg"); tex.colorSpace = THREE.SRGBColorSpace;
      const dc = document.createElement("canvas"); dc.width = dc.height = 32; { const g = dc.getContext("2d"); const gr = g.createRadialGradient(16, 16, 0, 16, 16, 15); gr.addColorStop(0, "#fff"); gr.addColorStop(0.55, "#fff"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); }
      const dotTex = new THREE.CanvasTexture(dc);
      const smooth = (x) => x * x * (3 - 2 * x);
      const clamp = (x) => Math.min(1, Math.max(0, x));

      /* 04 — partículas: esfera <-> galáxia */
      const N = 2600, sA = new Float32Array(N * 3), sB = new Float32Array(N * 3), cols = new Float32Array(N * 3), cur = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const y = 1 - (2 * (i + 0.5)) / N, r = Math.sqrt(1 - y * y), ph = i * 2.399963;
        sA.set([Math.cos(ph) * r * 1.5, y * 1.5, Math.sin(ph) * r * 1.5], i * 3);
        const rr = 0.35 + 2.1 * Math.sqrt((i + 0.5) / N);
        sB.set([Math.cos(ph) * rr, 0.14 * Math.sin(rr * 4), Math.sin(ph) * rr], i * 3);
        const c = new THREE.Color().setHSL(0.02 + 0.7 * (i / N), 0.9, 0.62); cols.set([c.r, c.g, c.b], i * 3);
      }
      const g1 = new THREE.BufferGeometry(); g1.setAttribute("position", new THREE.BufferAttribute(cur, 3)); g1.setAttribute("color", new THREE.BufferAttribute(cols, 3));
      const pts1 = new THREE.Points(g1, new THREE.PointsMaterial({ size: 0.07, vertexColors: true, sizeAttenuation: true, map: dotTex, transparent: true, alphaTest: 0.2, depthWrite: false }));
      const sc1 = new THREE.Scene(); sc1.add(pts1);
      const cam1 = new THREE.PerspectiveCamera(42, CW / CH, 0.1, 50); cam1.position.set(0, 1.4, 5.6); cam1.lookAt(0, 0, 0);

      /* 05 — órbita com card */
      const M = 650, pos2 = new Float32Array(M * 3);
      for (let i = 0; i < M; i++) { const y = 1 - (2 * (i + 0.5)) / M, r = Math.sqrt(1 - y * y), ph = i * 2.399963; pos2.set([Math.cos(ph) * r, y, Math.sin(ph) * r], i * 3); }
      const g2 = new THREE.BufferGeometry(); g2.setAttribute("position", new THREE.BufferAttribute(pos2, 3));
      const dots2 = new THREE.Points(g2, new THREE.PointsMaterial({ size: 0.06, color: 0x93c5fd, sizeAttenuation: true, map: dotTex, transparent: true, alphaTest: 0.2, depthWrite: false }));
      const card2 = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.9), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
      const sc2 = new THREE.Scene(); sc2.add(dots2, card2);
      const cam2 = new THREE.PerspectiveCamera(40, CW / CH, 0.1, 50); cam2.position.set(0, 0.5, 5.2); cam2.lookAt(0, 0, 0);

      /* 09 — shader líquido */
      const mat3 = new THREE.ShaderMaterial({
        uniforms: { uT: { value: 0 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: `varying vec2 vUv; uniform float uT;
          void main(){
            vec2 p = (vUv - 0.5) * vec2(3.4, 2.0);
            float t = uT * 0.7;
            for (int i = 1; i < 6; i++) { float fi = float(i); p += 0.55 / fi * vec2(sin(p.y * fi * 1.3 + t + fi * 1.7), cos(p.x * fi * 1.1 - t * 0.8 + fi)); }
            float v = 0.5 + 0.5 * sin(p.x * 1.6 + p.y * 1.2 + t);
            vec3 a = vec3(0.04, 0.05, 0.25), b = vec3(0.95, 0.2, 0.55), c = vec3(0.1, 0.85, 0.9);
            vec3 col = mix(a, b, smoothstep(0.15, 0.7, v)); col = mix(col, c, smoothstep(0.65, 1.0, v));
            col += 0.12 * pow(v, 6.0);
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      const sc3 = new THREE.Scene(); sc3.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat3));
      const cam3 = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      function vp(i, bg) { const { x, y } = cellPos(i); const gy = H - (y + CH); renderer.setViewport(x, gy, CW, CH); renderer.setScissor(x, gy, CW, CH); renderer.setClearColor(bg, 1); renderer.clear(); }
      function renderAt(time) {
        const lt = time % 4, a = lt / 4;
        const m = smooth(clamp((lt - 0.5) / 1.0)) * (1 - smooth(clamp((lt - 2.6) / 1.0)));
        for (let i = 0; i < N * 3; i++) cur[i] = sA[i] + (sB[i] - sA[i]) * m;
        g1.attributes.position.needsUpdate = true;
        pts1.rotation.y = a * Math.PI * 2; pts1.rotation.x = 0.25;
        vp(3, 0x05060f); renderer.render(sc1, cam1);

        dots2.rotation.y = a * Math.PI * 2;
        const ang = a * Math.PI * 2;
        card2.position.set(Math.cos(ang) * 1.75, Math.sin(ang) * 0.5, Math.sin(ang) * 1.5);
        card2.lookAt(cam2.position);
        vp(4, 0x0a0a14); renderer.render(sc2, cam2);

        mat3.uniforms.uT.value = time;
        vp(8, 0x000000); renderer.render(sc3, cam3);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
