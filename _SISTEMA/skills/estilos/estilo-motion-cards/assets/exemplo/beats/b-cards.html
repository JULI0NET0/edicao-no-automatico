<!DOCTYPE html>
<!--
  Estilo 2 — Motion explicativo + ícones animados. Painel SUPERIOR (0–860px), Julio embaixo (câmera y +760).
  Uma lista falada vira cards numerados: cada card entra um pouco ANTES da palavra e o ícone se desenha na
  hora. Um foco laranja por vez (o card da palavra atual). Montado em t=0 — tempos LOCAIS (s).
  Cues: contrato 2.95 · formulário 3.67 · e-mail 4.85 · whatsapp 5.98
-->
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; font-family: "Montserrat", sans-serif; }
        #b-panel {
          position: absolute; left: 0; top: 0; width: 1080px; height: 860px; overflow: hidden;
          background: radial-gradient(ellipse 70% 60% at 50% 40%, #1C1C1C 0%, #111111 62%, #0A0A0A 100%);
        }
        #b-edge {
          position: absolute; left: 0; top: 860px; width: 1080px; height: 6px;
          background: linear-gradient(90deg, rgba(249, 115, 22, 0), #F97316 20%, #FDBA74 50%, #F97316 80%, rgba(249, 115, 22, 0));
          box-shadow: 0 0 30px rgba(249, 115, 22, 0.8);
        }
        #b-kick {
          position: absolute; left: 50%; top: 44px; margin-left: -250px; width: 500px; height: 70px; border-radius: 35px;
          border: 3px solid #282828; background: #0A0A0A; color: #fff; opacity: 0;
          display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 30px; letter-spacing: 0.3em;
        }
        #b-kick .dot { width: 14px; height: 14px; border-radius: 7px; background: #A8A8A8; margin-right: 18px; }
        .b-card {
          position: absolute; width: 456px; height: 300px; border-radius: 38px; opacity: 0;
          background: linear-gradient(160deg, rgba(40, 40, 40, 0.96), rgba(18, 18, 18, 0.97));
          border: 4px solid #282828; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        }
        .b-card .n { position: absolute; right: 36px; top: 22px; color: #8A8A8A; font-weight: 900; font-size: 58px; }
        .b-card svg.ico { position: absolute; left: 38px; top: 34px; width: 124px; height: 124px; overflow: visible; }
        .b-card .lb { position: absolute; left: 38px; bottom: 74px; color: #fff; font-weight: 900; font-size: 46px; letter-spacing: 0.02em; white-space: nowrap; }
        .b-card .sub { position: absolute; left: 40px; bottom: 36px; color: #A8A8A8; font-weight: 800; font-size: 24px; letter-spacing: 0.3em; }
        .b-card .ck { position: absolute; right: 30px; bottom: 30px; width: 56px; height: 56px; opacity: 0; }
        .b-ghost {
          position: absolute; width: 456px; height: 300px; border-radius: 38px; opacity: 0;
          border: 4px dashed #6B6B6B; display: flex; align-items: center; justify-content: center;
          color: #6B6B6B; font-weight: 900; font-size: 96px;
        }
        #g1, #c1 { left: 56px; top: 150px; }
        #g2, #c2 { left: 568px; top: 150px; }
        #g3, #c3 { left: 56px; top: 480px; }
        #g4, #c4 { left: 568px; top: 480px; }
      </style>
      <div id="root" data-composition-id="b-cards" data-width="1080" data-height="1920">
        <div id="b-panel">
          <div id="b-kick"><span class="dot"></span>PROCESSO CHATO</div>

          <div class="b-ghost" data-layout-allow-overlap id="g1">?</div><div class="b-ghost" data-layout-allow-overlap id="g2">?</div>
          <div class="b-ghost" data-layout-allow-overlap id="g3">?</div><div class="b-ghost" data-layout-allow-overlap id="g4">?</div>
          <div class="b-card" id="c1">
            <svg class="ico" viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 12 H72 L92 32 V104 H30 Z" /><path d="M72 12 V32 H92" /><path d="M44 58 H78" /><path d="M44 74 H78" /><path d="M44 90 H62" /></svg>
            <div class="n">01</div><div class="lb">CONTRATO</div><div class="sub">ASSINAR</div>
            <svg class="ck" viewBox="0 0 56 56" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="22" /><path d="M18 29 L25 36 L39 20" /></svg>
          </div>
          <div class="b-card" id="c2">
            <svg class="ico" viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16 H98 V104 H22 Z" /><path d="M38 40 h16 v16 h-16 z" /><path d="M66 48 H84" /><path d="M38 70 h16 v16 h-16 z" /><path d="M66 78 H84" /><path d="M41 48 l5 5 l8 -10" /></svg>
            <div class="n">02</div><div class="lb">FORMULÁRIO</div><div class="sub">PREENCHER</div>
            <svg class="ck" viewBox="0 0 56 56" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="22" /><path d="M18 29 L25 36 L39 20" /></svg>
          </div>
          <div class="b-card" id="c3">
            <svg class="ico" viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 28 H108 V92 H12 Z" /><path d="M12 32 L60 68 L108 32" /></svg>
            <div class="n">03</div><div class="lb">E-MAIL</div><div class="sub">ENVIAR</div>
            <svg class="ck" viewBox="0 0 56 56" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="22" /><path d="M18 29 L25 36 L39 20" /></svg>
          </div>
          <div class="b-card" id="c4">
            <svg class="ico" viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 16 C34 16 14 34 14 56 C14 68 20 78 28 86 L22 106 L44 98 C49 100 54 100 60 100 C86 100 106 82 106 58 C106 34 86 16 60 16 Z" /><path d="M42 58 H44" /><path d="M58 58 H62" /><path d="M76 58 H78" /></svg>
            <div class="n">04</div><div class="lb">WHATSAPP</div><div class="sub">DISPARAR</div>
            <svg class="ck" viewBox="0 0 56 56" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="22" /><path d="M18 29 L25 36 L39 20" /></svg>
          </div>
        </div>
        <div id="b-edge"></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var CARDS = [
            { id: "#c1", at: 2.85 },
            { id: "#c2", at: 3.57 },
            { id: "#c3", at: 4.75 },
            { id: "#c4", at: 5.88 },
          ];
          var GLOW = "0 0 0 1px rgba(249,115,22,.45) inset, 0 0 60px rgba(249,115,22,.5), 0 30px 70px rgba(0,0,0,.55)";
          var CALM = "0 30px 70px rgba(0,0,0,.55)";

          // entry: panel whips down with the camera drop
          tl.fromTo("#b-panel", { yPercent: -100 }, { yPercent: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, 0);
          tl.fromTo("#b-edge", { y: -866 }, { y: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, 0);

          // kicker "PROCESSO CHATO" on the spoken words
          tl.fromTo("#b-kick", { opacity: 0, y: -20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, 0.55);
          tl.to("#b-kick", { backgroundColor: "#F97316", color: "#0A0A0A", borderColor: "#F97316", duration: 0.12, ease: "power2.out" }, 1.0);
          tl.to("#b-kick .dot", { backgroundColor: "#0A0A0A", duration: 0.12 }, 1.0);

          // draw-on setup for icons
          document.querySelectorAll("#b-panel svg.ico path").forEach(function (p) {
            var len = p.getTotalLength();
            gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
          });
          gsap.set(".b-card", { opacity: 0 });

          // ghost slots hint at the list while "de preencher" is spoken
          ["#g1", "#g2", "#g3", "#g4"].forEach(function (g, i) {
            tl.fromTo(g, { opacity: 0, scale: 0.94 }, { opacity: 0.9, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.6 + i * 0.12);
            tl.to(g, { opacity: 0, duration: 0.12, ease: "power1.in" }, CARDS[i].at + 0.04);
          });

          CARDS.forEach(function (c, i) {
            var from = i % 2 === 0 ? -90 : 90;
            tl.fromTo(c.id, { opacity: 0, x: from, y: 36, scale: 0.88 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.9)", immediateRender: false }, c.at);
            tl.to(c.id + " svg.ico path", { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut", stagger: 0.07 }, c.at + 0.08);
            // single orange focus: lights up on arrival, calms when the next one arrives
            tl.to(c.id, { borderColor: "#F97316", boxShadow: GLOW, duration: 0.14, ease: "power2.out" }, c.at + 0.1);
            tl.to(c.id + " svg.ico", { stroke: "#F97316", duration: 0.14 }, c.at + 0.1);
            tl.to(c.id + " .n", { color: "#F97316", duration: 0.14 }, c.at + 0.1);
            if (i < CARDS.length - 1) {
              var next = CARDS[i + 1].at;
              tl.to(c.id, { borderColor: "#282828", boxShadow: CALM, duration: 0.25, ease: "power2.inOut" }, next + 0.05);
              tl.to(c.id + " svg.ico", { stroke: "#FFFFFF", duration: 0.25 }, next + 0.05);
              tl.to(c.id + " .n", { color: "#8A8A8A", duration: 0.25 }, next + 0.05);
            }
          });

          // final: every manual step gets ticked off, in sequence
          CARDS.forEach(function (c, i) {
            tl.fromTo(c.id + " .ck", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)", immediateRender: false }, 6.35 + i * 0.1);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["b-cards"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
