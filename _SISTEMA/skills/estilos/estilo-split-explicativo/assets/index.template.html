<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>reel-julioneto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0A0A;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0A0A;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Camera wrappers: base footage and subject cutout move as one. */
      #cam,
      #cam-sub {
        position: absolute;
        inset: 0;
        transform-origin: 50% 38%;
        will-change: transform;
      }
      #cam {
        z-index: 1;
      }
      #cam-sub {
        z-index: 3;
        pointer-events: none;
        /* Poster stage scales the cutout down: soften the frame's cut edges into the dark. */
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 13%, #000 87%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 13%, #000 87%, transparent 100%);
      }
      #cam video,
      #cam-sub video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #cam-dim {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: #0A0A0A;
        opacity: 0;
        pointer-events: none;
      }
      .beat-behind {
        z-index: 2;
      }
      .beat-front {
        z-index: 4;
      }
      #cc-container {
        z-index: 6;
        pointer-events: none;
      }
      .fx-layer {
        z-index: 8;
        pointer-events: none;
      }
      /* ---------- captions ---------- */
      .cc-group {
        position: absolute;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
        padding: 0 70px;
        opacity: 0;
        visibility: hidden;
      }
      .cc-group::before {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        top: -34px;
        bottom: -34px;
        background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 72%);
        z-index: 0;
      }
      .cc-group.mode-low {
        bottom: 560px;
      }
      .cc-group.mode-seam {
        bottom: 772px;
      }
      .cc-group.mode-top {
        top: 190px;
      }
      .cc-word {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 66px;
        text-transform: uppercase;
        color: #ffffff;
        display: inline-block;
        letter-spacing: 0.005em;
        line-height: 1.05;
        position: relative;
        z-index: 1;
        padding: 6px 14px 8px;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
        transform-origin: 50% 60%;
      }
      .cc-word.emphasis {
        color: #F97316;
      }
      .cc-word-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
        border-radius: 12px;
        box-shadow: 0 10px 26px rgba(249, 115, 22, 0.4);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: 0;
      }
      .cc-word-text {
        position: relative;
        z-index: 1;
      }
      .cc-word.emphasis .cc-word-bg {
        background: #0A0A0A;
        box-shadow: 0 0 0 4px #F97316, 0 10px 30px rgba(249, 115, 22, 0.45);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__ROOT_DURATION__"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video
          id="talking-head"
          class="clip"
          src="assets/limpo.mp4"
          data-start="0"
          data-duration="__VIDEO_DURATION__"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>
      <div id="cam-dim"></div>

__BEHIND_HOSTS__

      <div id="cam-sub">
__SUBJECT_CLIPS__
      </div>

__FRONT_HOSTS__

      <audio
        id="voice"
        src="assets/limpo.mp4"
        data-start="0"
        data-duration="__VIDEO_DURATION__"
        data-track-index="30"
        data-volume="1"
      ></audio>

__SFX_AUDIO__

__BGM_AUDIO__

      <div id="cc-container" class="clip" data-start="0" data-duration="__ROOT_DURATION__" data-track-index="2"></div>

      <div
        id="fx"
        class="fx-layer clip"
        data-composition-id="fx-overlay"
        data-composition-src="compositions/fx-overlay.html"
        data-start="0"
        data-duration="__ROOT_DURATION__"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---------- camera (yt-camera-move helpers, driving both wrappers) ----------
        var CAM = "#cam, #cam-sub";
        gsap.set(CAM, { transformPerspective: 1400, scale: 1, x: 0, y: 0 });
        var CAMERA = __CAMERA__;
        // t: "cam" = base footage (default), "sub" = poster-stage subject cutout.
        var CAM_TARGET = { cam: "#cam", sub: "#cam-sub", both: CAM };
        CAMERA.forEach(function (k) {
          tl.to(
            CAM_TARGET[k.t || "cam"],
            {
              scale: k.scale,
              x: k.x || 0,
              y: k.y || 0,
              rotation: k.roll || 0,
              duration: k.dur,
              ease: k.ease || "power2.inOut",
            },
            k.at,
          );
        });
        // Directional whip blur on the footage (whip-pan-cut: capped blur at peak velocity).
        var WHIPS = __WHIPS__;
        WHIPS.forEach(function (w) {
          tl.fromTo(
            "#cam",
            { filter: "blur(0px)" },
            { filter: "blur(" + w.blur + "px)", duration: w.dur / 2, ease: "power2.in" },
            w.at,
          );
          tl.to("#cam", { filter: "blur(0px)", duration: w.dur / 2, ease: "power2.out" }, w.at + w.dur / 2);
        });
        // Micro camera shake on impacts (camera-shake: short, decaying, deterministic).
        var SHAKES = __SHAKES__;
        SHAKES.forEach(function (s) {
          var offs = [
            [9, -6],
            [-7, 5],
            [5, 4],
            [-3, -3],
            [1, 1],
            [0, 0],
          ];
          offs.forEach(function (o, i) {
            // xPercent/yPercent compose independently of the camera's x/y moves.
            tl.to(
              CAM,
              { xPercent: o[0] * s.amp * 0.09, yPercent: o[1] * s.amp * 0.05, duration: 0.035, ease: "none" },
              s.at + i * 0.035,
            );
          });
        });
        // Footage dim for graphic-heavy beats.
        var DIMS = __DIMS__;
        DIMS.forEach(function (d) {
          tl.to("#cam-dim", { opacity: d.to, duration: d.dur, ease: "power2.inOut" }, d.at);
        });

        // ---------- captions (karaoke, derived from caption-highlight) ----------
        var _fitCanvas = document.createElement("canvas");
        var _fitCtx = _fitCanvas.getContext("2d");
        function fitFontSize(text, base, weight, family, maxWidth) {
          var size = base;
          var min = Math.floor(base * 0.5);
          while (size > min) {
            _fitCtx.font = weight + " " + size + "px " + family;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return min;
        }

        var WORDS = __WORDS__;
        var GROUPS = __GROUPS__;
        var EMPHASIS = __EMPHASIS__;
        var container = document.getElementById("cc-container");

        GROUPS.forEach(function (g, gi) {
          var groupWords = WORDS.slice(g.wordStart, g.wordEnd + 1);
          var grp = document.createElement("div");
          grp.className = "cc-group mode-" + g.mode;
          grp.id = "cc-grp-" + gi;
          var groupText = groupWords
            .map(function (w) {
              return w.text.toUpperCase();
            })
            .join(" ");
          var size = fitFontSize(groupText, 66, "900", "Montserrat", 880);

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var wordEl = document.createElement("span");
            wordEl.className = "cc-word" + (EMPHASIS.indexOf(wi) !== -1 ? " emphasis" : "");
            wordEl.id = "cc-w-" + wi;
            wordEl.style.fontSize = size + "px";
            var bgEl = document.createElement("span");
            bgEl.className = "cc-word-bg";
            bgEl.id = "cc-bg-" + wi;
            var textEl = document.createElement("span");
            textEl.className = "cc-word-text";
            textEl.textContent = w.text.toUpperCase();
            wordEl.appendChild(bgEl);
            wordEl.appendChild(textEl);
            grp.appendChild(wordEl);
          });
          container.appendChild(grp);

          tl.set(grp, { visibility: "visible" }, g.start);
          tl.fromTo(
            grp,
            { opacity: 0, y: 14, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2)" },
            g.start,
          );
          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var bgEl = document.getElementById("cc-bg-" + wi);
            var wordEl = document.getElementById("cc-w-" + wi);
            var isEm = EMPHASIS.indexOf(wi) !== -1;
            tl.to(bgEl, { opacity: 1, scaleX: 1, duration: 0.12, ease: "power2.out" }, w.start);
            tl.to(wordEl, { scale: isEm ? 1.14 : 1.05, duration: 0.09, ease: "back.out(1.7)" }, w.start);
            tl.to(wordEl, { scale: 1, duration: 0.16, ease: "power2.out" }, w.start + 0.09);
            tl.to(bgEl, { opacity: 0, scaleX: 1.02, duration: 0.1, ease: "power2.in" }, w.end);
            tl.set(bgEl, { scaleX: 0 }, w.end + 0.1);
          });
          tl.to(grp, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
          tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
        });

        tl.seek(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
