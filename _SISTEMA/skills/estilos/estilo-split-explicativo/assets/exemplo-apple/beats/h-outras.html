<!doctype html>
<!--
  Beat H — split screen, "vão querer um iPhone dobrável… talvez não possam…
  vão comprar de outras marcas".
  focus-swap: two side-by-side cards; the unfocused one sits at 0.92 scale,
  6px blur, 0.5 opacity, and both move together in one clean exchange.
  hw-underline "strike" (double pass, deterministic hash wobble) crosses out
  the price; hw-arrow draws a wobbled swoop from one card to the other.
  Mounted at global 35.6 — cue constants below are GLOBAL seconds.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          font-family: "Montserrat", sans-serif;
        }
        #h-panel {
          position: absolute;
          left: 0;
          top: 1040px;
          width: 1080px;
          height: 880px;
          overflow: hidden;
          background: radial-gradient(ellipse 70% 60% at 50% 40%, #1C1C1C 0%, #111111 62%, #0A0A0A 100%);
        }
        #h-edge {
          position: absolute;
          left: 0;
          top: 1034px;
          width: 1080px;
          height: 6px;
          background: linear-gradient(90deg, rgba(249, 115, 22, 0), #F97316 20%, #FDBA74 50%, #F97316 80%, rgba(249, 115, 22, 0));
          box-shadow: 0 0 30px rgba(249, 115, 22, 0.8);
          transform-origin: 50% 50%;
        }
        .h-card {
          position: absolute;
          top: 150px;
          width: 460px;
          height: 640px;
          border-radius: 40px;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025));
          border: 2px solid rgba(255, 255, 255, 0.13);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
          overflow: hidden;
          transform-origin: 50% 50%;
        }
        #h-left {
          left: 50px;
        }
        #h-right {
          left: 570px;
        }
        .h-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 50% 38%, rgba(249, 115, 22, 0.15), rgba(249, 115, 22, 0.0) 55%);
        }
        .h-kicker {
          position: absolute;
          top: 34px;
          width: 100%;
          text-align: center;
          font-weight: 800;
          font-size: 22px;
          letter-spacing: 0.3em;
          color: #A8A8A8;
        }
        .h-name {
          position: absolute;
          bottom: 132px;
          width: 100%;
          text-align: center;
          font-family: "League Gothic", sans-serif;
          font-size: 74px;
          line-height: 0.95;
          color: #fff;
        }
        #h-left img {
          position: absolute;
          left: 60px;
          top: 80px;
          width: 340px;
          height: 300px;
          object-fit: contain;
          filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.6));
        }
        .h-fan img {
          position: absolute;
          width: 230px;
          height: 230px;
          object-fit: contain;
          filter: drop-shadow(0 20px 28px rgba(0, 0, 0, 0.6));
        }
        #h-price {
          position: absolute;
          left: 0;
          bottom: 44px;
          width: 100%;
          display: flex;
          justify-content: center;
        }
        #h-price-chip {
          position: relative;
          padding: 8px 26px 10px;
          border-radius: 14px;
          background: #FFFFFF;
          color: #0A0A0A;
          font-weight: 900;
          font-size: 52px;
          letter-spacing: 0.08em;
        }
        #h-strike {
          position: absolute;
          left: -16px;
          top: -6px;
          width: calc(100% + 32px);
          height: calc(100% + 12px);
          overflow: visible;
        }
        #h-strike path {
          fill: none;
          stroke: #F97316;
          stroke-width: 11;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #h-nope {
          position: absolute;
          left: 0;
          width: 100%;
          top: 250px;
          text-align: center;
          opacity: 0;
        }
        #h-nope span {
          display: inline-block;
          padding: 8px 18px 10px;
          border-radius: 10px;
          background: #0A0A0A;
          border: 3px solid #F97316;
          color: #fff;
          font-weight: 900;
          font-size: 26px;
          letter-spacing: 0.12em;
          transform: rotate(-4deg);
        }
        #h-yes {
          position: absolute;
          left: 0;
          bottom: 44px;
          width: 100%;
          display: flex;
          justify-content: center;
          opacity: 0;
        }
        #h-yes span {
          padding: 8px 22px 10px;
          border-radius: 14px;
          background: #F97316;
          color: #0A0A0A;
          font-weight: 900;
          font-size: 40px;
          letter-spacing: 0.06em;
        }
        #h-arrow {
          position: absolute;
          left: 0;
          top: 1040px;
          width: 1080px;
          height: 880px;
          overflow: visible;
        }
        #h-arrow path {
          fill: none;
          stroke: #F97316;
          stroke-width: 9;
          stroke-linecap: round;
          stroke-linejoin: round;
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
        }
      </style>
      <div id="root" data-composition-id="h-outras" data-width="1080" data-height="1920">
        <div id="h-panel">
          <div class="h-card" id="h-left">
            <div class="h-kicker">O QUE QUEREM</div>
            <img src="assets/img/fold-silver.png" />
            <div class="h-name">IPHONE<br />DOBRÁVEL</div>
            <div id="h-price">
              <div id="h-price-chip">$$$$<svg id="h-strike"><path d="" /></svg></div>
            </div>
            <div id="h-nope"><span>TALVEZ NÃO POSSAM</span></div>
          </div>
          <div class="h-card h-fan" id="h-right">
            <div class="h-kicker">O QUE COMPRAM</div>
            <img id="h-f1" src="assets/img/fold-green.png" style="left: 10px; top: 110px" />
            <img id="h-f3" src="assets/img/fold-orange.png" style="left: 220px; top: 110px" />
            <img id="h-f2" src="assets/img/fold-purple.png" style="left: 115px; top: 80px" />
            <div class="h-name">OUTRAS<br />MARCAS</div>
            <div id="h-yes"><span>✓ VÃO COMPRAR</span></div>
          </div>
        </div>
        <div id="h-edge"></div>
        <svg id="h-arrow" viewBox="0 0 1080 880"><path id="h-arrow-path" d="" /></svg>
      </div>
      <script>
        (function () {
          var OFFSET = 35.6;
          var T = function (g) {
            return g - OFFSET;
          };
          var ENTER = 35.72;
          var LEFT_IN = 35.95; // right after the whip
          var RIGHT_IN = 36.35;
          var IPHONE = 38.65; // "iPhone dobrável"
          var STRIKE = 40.16; // "não vão poder"
          var SWAP = 41.05; // "vão comprar de outras marcas"
          var MARCAS = 42.13;
          var EXIT = 42.72;

          // hw-underline helpers (deterministic wobble).
          function hash(n, seed) {
            var x = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453;
            return (x - Math.floor(x)) * 2 - 1;
          }
          function strikePath(w, h, seed) {
            var mid = h / 2;
            var wob = function (n, r) {
              return hash(n, seed) * (r === undefined ? 5 : r);
            };
            return (
              "M " + (2 + wob(1, 3)) + " " + (mid + wob(2)) +
              " L " + (w - 4 + wob(3, 3)) + " " + (mid - 3 + wob(4)) +
              " M " + (w - 10 + wob(5, 4)) + " " + (mid + 7 + wob(6)) +
              " L " + (8 + wob(7, 4)) + " " + (mid + 3 + wob(8))
            );
          }
          var chip = document.getElementById("h-price-chip");
          var strike = document.querySelector("#h-strike path");
          strike.setAttribute("d", strikePath(chip.offsetWidth + 32, chip.offsetHeight + 12, 6));
          var sLen = strike.getTotalLength();
          gsap.set(strike, { strokeDasharray: sLen, strokeDashoffset: sLen, opacity: 0 });

          // hw-arrow swoop: left card top → right card top (panel coords).
          var ap = document.getElementById("h-arrow-path");
          ap.setAttribute("d", "M 290 806 Q 540 876 790 806 M 790 806 L 748 800 M 790 806 L 770 770");
          var aLen = ap.getTotalLength();
          gsap.set(ap, { strokeDasharray: aLen, strokeDashoffset: aLen, opacity: 0 });

          var tl = gsap.timeline({ paused: true });
          var sharp = "blur(0px)";
          var soft = "blur(6px)";
          gsap.set("#h-panel", { opacity: 0 });
          gsap.set(["#h-left", "#h-right"], { opacity: 0 });

          // Entry: whip-pan-cut into the split.
          tl.set("#h-panel", { opacity: 1 }, T(ENTER));
          tl.fromTo("#h-panel", { x: -1080, filter: "blur(22px)" }, { x: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.inOut", immediateRender: false }, T(ENTER));
          tl.fromTo("#h-edge", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, T(ENTER + 0.2));

          tl.fromTo("#h-left", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, filter: sharp, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, T(LEFT_IN));
          tl.fromTo("#h-right", { opacity: 0, y: 60, scale: 0.85 }, { opacity: 0.5, y: 0, scale: 0.92, filter: soft, duration: 0.45, ease: "power3.out", immediateRender: false }, T(RIGHT_IN));
          // "iPhone dobrável": hero bump.
          tl.to("#h-left img", { scale: 1.08, duration: 0.25, ease: "back.out(2)" }, T(IPHONE - 0.05));
          tl.to("#h-left img", { scale: 1, duration: 0.5, ease: "power2.out" }, T(IPHONE + 0.3));
          // "talvez não vão poder": double-pass strike + red stamp.
          tl.set(strike, { opacity: 1 }, T(STRIKE));
          tl.to(strike, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, T(STRIKE));
          tl.fromTo("#h-nope", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.in", immediateRender: false }, T(STRIKE + 0.35));
          // focus-swap: both sides move together.
          tl.to("#h-left", { opacity: 0.5, scale: 0.92, filter: soft, duration: 0.45, ease: "power2.inOut" }, T(SWAP));
          tl.to("#h-right", { opacity: 1, scale: 1, filter: sharp, duration: 0.45, ease: "power2.inOut" }, T(SWAP));
          tl.to("#h-nope", { opacity: 0.4, duration: 0.45 }, T(SWAP));
          tl.set(ap, { opacity: 1 }, T(SWAP - 0.05));
          tl.to(ap, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, T(SWAP - 0.05));
          ["#h-f1", "#h-f2", "#h-f3"].forEach(function (f, i) {
            tl.fromTo(f, { y: 40, rotation: (i - 1) * -8, scale: 0.9 }, { y: 0, rotation: (i - 1) * 10, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, T(SWAP + 0.15 + i * 0.08));
          });
          tl.fromTo("#h-yes", { opacity: 0, y: 20, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.5)", immediateRender: false }, T(MARCAS));

          // Exit: panel drops as the payoff stage takes over.
          tl.to(["#h-panel", "#h-arrow", "#h-edge"], { y: 900, duration: 0.4, ease: "power3.in" }, T(EXIT));

          window.__timelines = window.__timelines || {};
          window.__timelines["h-outras"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
