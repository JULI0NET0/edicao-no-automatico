<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=445, height=300" />
    <title>moodboard-legendas · célula 02</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; background: #0b0b0f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0f; font-family: Montserrat, sans-serif; color: #fff; }
      .hd { position: absolute; left: 40px; top: 38px; font-weight: 800; font-size: 22px; letter-spacing: 0.22em; }
      .hd2 { position: absolute; right: 40px; top: 42px; font-weight: 600; font-size: 14px; letter-spacing: 0.18em; color: #8a8a96; }
      .cell { position: absolute; width: 445px; height: 300px; border-radius: 14px; overflow: hidden; background: #15151c; }
      .st { position: absolute; left: 0; top: 0; width: 445px; height: 260px; overflow: hidden; }
      .lb { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #15151c; }
      .lb b { font-weight: 800; font-size: 13px; letter-spacing: 0.14em; }
      .lb b i { font-style: normal; color: #8a8a96; margin-right: 8px; }
      .lb span { font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #8a8a96; }
      .a { position: absolute; }
      svg { position: absolute; left: 0; top: 0; }
      .cap { position: absolute; left: 0; right: 0; text-align: center; }
      .w { display: inline-block; white-space: pre; }

      /* 01 pill */
      .pill { position: absolute; left: 50%; bottom: 40px; width: 400px; margin-left: -200px; padding: 12px 6px; border-radius: 40px; background: #fff; text-align: center; font-weight: 800; font-size: 19px; white-space: nowrap; color: #111; }
      .pill .w { padding: 2px 7px; border-radius: 16px; }
      /* 02 highlight */
      .hl { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-weight: 900; font-size: 30px; color: #fff; white-space: nowrap; }
      .hl .w { position: relative; isolation: isolate; padding: 0 8px; margin: 0 2px; }
      .hl .w i { position: absolute; inset: 2px 0 2px 0; background: #ef4444; transform-origin: 0 50%; z-index: 0; border-radius: 4px; }
      .hl .w b { position: relative; z-index: 1; font-weight: 900; }
      /* 03 gradient */
      .gf { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-weight: 900; font-size: 46px; line-height: 1.12; letter-spacing: -0.02em; }
      .gf .w { padding: 0 5px; background: linear-gradient(90deg, #ff3d9a, #ff8a00, #ffd400); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* 04 neon */
      .nn { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font-weight: 800; font-size: 44px; color: #e0f7ff; text-shadow: 0 0 6px #22d3ee, 0 0 18px #22d3ee, 0 0 40px #0891b2; }
      .nn .w { padding: 0 6px; }
      .nn .k { color: #ffe0f7; text-shadow: 0 0 6px #f0abfc, 0 0 18px #e879f9, 0 0 40px #c026d3; }
      /* 05 glitch */
      .gt { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-weight: 900; font-size: 38px; letter-spacing: 0.02em; }
      .gr { color: #ff2a55; mix-blend-mode: screen; }
      .gc { color: #00e5ff; mix-blend-mode: screen; }
      .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px); }
      /* 06 matrix */
      .mx { position: absolute; left: 0; right: 0; top: 104px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.08em; color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,.6); white-space: pre; }
      /* 07 slam */
      .sl { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
      .sl span { display: block; font-weight: 900; font-size: 92px; letter-spacing: -0.03em; }
      /* 08 editorial */
      .ed1 { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-weight: 700; font-size: 15px; letter-spacing: 0.34em; color: #e5e7eb; }
      .ed2 { position: absolute; left: 0; right: 0; top: 98px; text-align: center; font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 66px; color: #fcd34d; letter-spacing: -0.01em; }
      /* 09 weight */
      .wt { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-size: 42px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 200; color: #fff; }
      .wt .w { padding: 0 6px; }
      /* 10 parallax */
      .px { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-weight: 900; font-size: 62px; letter-spacing: -0.02em; color: #fff; transform-origin: 50% 50%; }
      /* 11 burst */
      .bs { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-weight: 900; font-size: 48px; }
      .bs .w { padding: 0 8px; }
      /* 12 emoji */
      .em { position: absolute; left: 0; right: 0; top: 94px; text-align: center; font-weight: 900; font-size: 42px; color: #fff; -webkit-text-stroke: 2px #111; paint-order: stroke fill; text-shadow: 0 3px 0 #111; }
      .em .w { padding: 0 6px; }
    </style>
    <style>#root { width: 445px !important; height: 300px !important; }</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="445" data-height="300">
    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const root = document.getElementById("root");
      const L = 4, LOOPS = 3;
      const tl = gsap.timeline({ paused: true });
      const ft = (tg, a, b, p) => tl.fromTo(tg, a, { ...b, immediateRender: false }, p);
      const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
      const words = (parent, arr, cls) => arr.map((t, i) => { const w = mk("span", "w" + (cls && cls[i] ? " " + cls[i] : ""), t); parent.appendChild(w); parent.appendChild(document.createTextNode(i < arr.length - 1 ? " " : "")); return w; });
      const cells = [];
      const cell = (n, name, tech, bg, build) => cells.push({ n, name, tech, bg, build });
      const ex = (el) => { el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", ""); };

      /* 01 — Pill karaokê */
      cell("01", "PILL KARAOKÊ", "caption-pill-karaoke", "linear-gradient(135deg,#1e293b,#0f172a)", (st) => {
        const p = mk("div", "pill"); st.appendChild(p);
        const ws = words(p, ["Quem", "usa", "IA", "vai", "na", "frente"]);
        return (t0) => {
          ft(p, { scale: 0.7, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, t0 + 0.1);
          ws.forEach((w, i) => {
            ft(w, { backgroundColor: "#ffffff", color: "#111111" }, { backgroundColor: "#7c3aed", color: "#ffffff", duration: 0.1 }, t0 + 0.4 + i * 0.5);
            ft(w, { backgroundColor: "#7c3aed", color: "#ffffff" }, { backgroundColor: "#ffffff", color: "#111111", duration: 0.1 }, t0 + 0.4 + (i + 1) * 0.5);
          });
          ft(p, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.65);
        };
      });

      /* 02 — Highlight estilo TikTok */
      cell("02", "HIGHLIGHT", "caption-highlight", "linear-gradient(135deg,#27272a,#09090b)", (st) => {
        const h = mk("div", "hl"); st.appendChild(h);
        const data = ["Pare", "de", "editar", "sozinho"];
        const ws = data.map((t) => { const w = mk("span", "w", `<i></i><b>${t}</b>`); h.appendChild(w); h.appendChild(document.createTextNode(" ")); return w; });
        const bgs = ws.map((w) => w.querySelector("i"));
        return (t0) => {
          ft(ws, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.55 }, t0 + 0.3);
          bgs.forEach((b, i) => {
            ft(b, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, t0 + 0.3 + i * 0.55);
            ft(b, { opacity: 1 }, { opacity: 0, duration: 0.12 }, t0 + 0.3 + (i + 1) * 0.55);
          });
          ft(ws, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.65);
        };
      });

      /* 03 — Gradient fill com bounce */
      cell("03", "GRADIENT BOUNCE", "caption-gradient-fill", "radial-gradient(circle at 50% 50%,#312e81,#0c0a1f)", (st) => {
        const g = mk("div", "gf"); st.appendChild(g);
        const ws = words(g, ["Edite", "10x", "mais", "rápido"]);
        return (t0) => {
          ft(ws, { y: 40, scale: 0.4, opacity: 0, rotation: -6 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "elastic.out(1,0.5)", stagger: 0.28 }, t0 + 0.2);
          ft(ws, { opacity: 1, y: 0 }, { opacity: 0, y: -20, duration: 0.3, ease: "power2.in", stagger: 0.04 }, t0 + 3.5);
        };
      });

      /* 04 — Neon */
      cell("04", "NEON GLOW", "caption-neon-glow · accent", "linear-gradient(135deg,#1a0536,#050010)", (st) => {
        const n = mk("div", "nn"); st.appendChild(n);
        const ws = words(n, ["IA", "nunca", "dorme"], [null, null, "k"]);
        return (t0) => {
          ws.forEach((w, i) => {
            const a = t0 + 0.3 + i * 0.6;
            ft(w, { opacity: 0 }, { opacity: 1, duration: 0.05 }, a);
            tl.to(w, { opacity: 0.2, duration: 0.05 }, a + 0.08); tl.to(w, { opacity: 1, duration: 0.05 }, a + 0.14);
            tl.to(w, { opacity: 0.5, duration: 0.04 }, a + 0.24); tl.to(w, { opacity: 1, duration: 0.05 }, a + 0.3);
            ft(w, { y: 0 }, { y: -4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, a + 0.4);
          });
          ft(ws, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t0 + 3.7);
        };
      });

      /* 05 — Glitch RGB */
      cell("05", "GLITCH RGB", "caption-glitch-rgb · scanlines", "#000", (st) => {
        const txt = "VOCÊ FOI SUBSTITUÍDO";
        const gr = mk("div", "gt gr", txt), gc = mk("div", "gt gc", txt), gw = mk("div", "gt", txt), sc = mk("div", "scan");
        [gr, gc, gw].forEach(ex); st.append(gr, gc, gw, sc);
        gr.style.fontSize = gc.style.fontSize = gw.style.fontSize = "28px";
        const bursts = [[0.5, 12], [0.64, -9], [1.4, 16], [1.52, -12], [2.3, 10], [2.42, -14], [3.1, 18]];
        return (t0) => {
          ft(gw, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0 + 0.1);
          bursts.forEach(([t, d]) => {
            const a = t0 + t;
            ft(gr, { x: 0 }, { x: d, duration: 0.05 }, a); tl.to(gr, { x: 0, duration: 0.07 }, a + 0.09);
            ft(gc, { x: 0 }, { x: -d, duration: 0.05 }, a); tl.to(gc, { x: 0, duration: 0.07 }, a + 0.09);
            ft(gw, { skewX: 0 }, { skewX: d * 0.6, duration: 0.04 }, a); tl.to(gw, { skewX: 0, duration: 0.05 }, a + 0.08);
          });
          ft([gw, gr, gc], { opacity: 1 }, { opacity: 0, duration: 0.2 }, t0 + 3.7);
        };
      });

      /* 06 — Matrix decode */
      cell("06", "MATRIX DECODE", "caption-matrix-decode", "#020a05", (st) => {
        const m = mk("div", "mx"); st.appendChild(m);
        const target = "ACESSO LIBERADO", set = "#$%&@01XZ+=*/<>";
        const render = (v) => {
          let out = "";
          for (let i = 0; i < target.length; i++) {
            const ch = target[i];
            if (ch === " ") { out += " "; continue; }
            out += v * (target.length + 4) > i + 2 ? ch : set[(i * 7 + Math.floor(v * 40) * 3) % set.length];
          }
          m.textContent = out;
        };
        return (t0) => {
          const o = { v: 0 }, o2 = { v: 1 };
          tl.fromTo(o, { v: 0 }, { v: 1, duration: 1.5, ease: "none", onUpdate: () => render(o.v), immediateRender: false }, t0 + 0.2);
          tl.fromTo(o2, { v: 1 }, { v: 0, duration: 0.4, ease: "none", onUpdate: () => render(o2.v), immediateRender: false }, t0 + 3.5);
          tl.set(m, { textContent: "" }, t0 + 3.95);
        };
      });

      /* 07 — Kinetic slam */
      cell("07", "KINETIC SLAM", "caption-kinetic-slam", "#111", (st) => {
        const data = [["ISSO", "#dc2626", "#fff", "x", -260], ["MUDA", "#facc15", "#111", "y", 200], ["TUDO", "#2563eb", "#fff", "x", 260]];
        const ls = data.map(([t, bg, c]) => { const d = mk("div", "sl", `<span>${t}</span>`); d.style.background = bg; d.style.color = c; d.style.opacity = "0"; st.appendChild(d); return d; });
        return (t0) => {
          data.forEach(([, , , ax, off], i) => {
            const a = t0 + 0.2 + i * 1.1, sp = ls[i].firstChild;
            ft(ls[i], { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
            ft(sp, { [ax]: off, scale: 1.6 }, { [ax]: 0, scale: 1, duration: 0.3, ease: "expo.out" }, a);
            ft(ls[i], { opacity: 1 }, { opacity: 0, duration: 0.01 }, a + 1.05);
          });
        };
      });

      /* 08 — Editorial */
      cell("08", "EDITORIAL", "caption-editorial-emphasis", "linear-gradient(135deg,#1c1917,#0c0a09)", (st) => {
        const a = mk("div", "ed1", "A IA NÃO SUBSTITUI SUA"), b = mk("div", "ed2", "criatividade");
        st.append(a, b);
        return (t0) => {
          ft(a, { opacity: 0, y: -12, letterSpacing: "0.6em" }, { opacity: 1, y: 0, letterSpacing: "0.34em", duration: 0.7, ease: "power3.out" }, t0 + 0.2);
          ft(b, { opacity: 0, y: 24, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, t0 + 0.9);
          ft([a, b], { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6);
        };
      });

      /* 09 — Weight shift */
      cell("09", "WEIGHT SHIFT", "caption-weight-shift", "linear-gradient(135deg,#0f172a,#1e1b4b)", (st) => {
        const w = mk("div", "wt"); st.appendChild(w);
        const ws = words(w, ["da", "ideia", "ao", "resultado"]);
        return (t0) => {
          ws.forEach((x, i) => {
            ft(x, { fontWeight: 200, color: "#94a3b8" }, { fontWeight: 900, color: "#ffffff", duration: 0.5, ease: "power2.out" }, t0 + 0.3 + i * 0.6);
            ft(x, { fontWeight: 900 }, { fontWeight: 200, color: "#94a3b8", duration: 0.5, ease: "power2.inOut" }, t0 + 3.0 + i * 0.1 > t0 + 3.6 ? t0 + 3.5 : t0 + 3.0 + i * 0.1);
          });
        };
      });

      /* 10 — Texto atrás da pessoa (parallax) */
      cell("10", "ATRÁS DO JULIO", "caption-parallax-layers", "linear-gradient(180deg,#f97316,#be185d 60%,#312e81)", (st) => {
        const t = mk("div", "px", "PRESENÇA"); ex(t); st.appendChild(t);
        const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", 445); svg.setAttribute("height", 260); svg.setAttribute("viewBox", "0 0 445 260");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", "M50,50 a50,50 0 1,0 100,0 a50,50 0 1,0 -100,0 Z M28,128 Q100,104 172,128 L184,272 L16,272 Z");
        p.setAttribute("fill", "#0b0b14"); p.setAttribute("transform", "translate(160,40) scale(0.62 0.62)");
        ex(svg); svg.appendChild(p); st.appendChild(svg);
        return (t0) => {
          ft(t, { scaleY: 0.6, y: 30, opacity: 0, letterSpacing: "-0.06em" }, { scaleY: 1.12, y: 0, opacity: 1, letterSpacing: "-0.02em", duration: 1.2, ease: "power3.out" }, t0 + 0.2);
          ft(t, { scaleY: 1.12 }, { scaleY: 1.2, duration: 1.8, ease: "sine.inOut" }, t0 + 1.4);
          ft(t, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t0 + 3.6);
        };
      });

      /* 11 — Partículas na palavra-chave */
      cell("11", "PARTICLE BURST", "caption-particle-burst", "linear-gradient(135deg,#0f172a,#1e293b)", (st) => {
        const b = mk("div", "bs"); st.appendChild(b);
        const ws = words(b, ["Isso", "é", "VIRAL"], [null, null, "k"]);
        ws[2].style.color = "#fbbf24";
        const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", 445); svg.setAttribute("height", 260); svg.setAttribute("viewBox", "0 0 445 260"); st.appendChild(svg);
        const cols = ["#f472b6", "#fbbf24", "#34d399", "#60a5fa", "#fb7185"], N = 28;
        const ps = Array.from({ length: N }, (_, i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 330); c.setAttribute("cy", 122); c.setAttribute("r", 3 + (i % 3)); c.setAttribute("fill", cols[i % cols.length]); c.setAttribute("opacity", 0); svg.appendChild(c); return c; });
        return (t0) => {
          ft(ws, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.35 }, t0 + 0.2);
          ft(ws[2], { scale: 1 }, { scale: 1.25, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + 0.9);
          ft(ps, { x: 0, y: 0, opacity: 1 }, { x: (i) => Math.cos((i / N) * Math.PI * 2) * (50 + (i % 4) * 22), y: (i) => Math.sin((i / N) * Math.PI * 2) * (40 + (i % 3) * 20), opacity: 0, duration: 0.9, ease: "power3.out" }, t0 + 0.9);
          ft(ws, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.65);
        };
      });

      /* 12 — Emoji pop */
      cell("12", "EMOJI POP", "caption-emoji-pop", "linear-gradient(135deg,#7c3aed,#db2777)", (st) => {
        const e = mk("div", "em"); st.appendChild(e);
        const ws = words(e, ["Fogo", "🔥", "total", "🚀"]);
        return (t0) => {
          ws.forEach((w, i) => ft(w, { scaleX: 0.15, scaleY: 1.5, opacity: 0, y: 14 }, { scaleX: 1, scaleY: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(2.5)" }, t0 + 0.2 + i * 0.4));
          ft(ws[1], { rotation: -12 }, { rotation: 12, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 1.1);
          ft(ws[3], { y: 0 }, { y: -8, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 1.7);
          ft(ws, { opacity: 1 }, { opacity: 0, duration: 0.25 }, t0 + 3.65);
        };
      });

      cells.splice(0, cells.length, ...cells.filter((c) => c.n === "02"));

      const fns = cells.map((c, i) => {
        const el = mk("div", "cell"); el.id = "c" + c.n;
        el.style.left = "0px"; el.style.top = "0px";
        const st = mk("div", "st"); st.style.background = c.bg; el.appendChild(st);
        el.appendChild(mk("div", "lb", `<b><i>${c.n}</i>${c.name}</b><span>${c.tech}</span>`));
        root.appendChild(el);
        return c.build(st);
      });
      for (let k = 0; k < LOOPS; k++) fns.forEach((f) => f(k * L));
      (window.__timelines ||= {})["main"] = tl;
      if (window.self === window.top && !navigator.webdriver) tl.repeat(-1).play();
    </script>
  </body>
</html>
