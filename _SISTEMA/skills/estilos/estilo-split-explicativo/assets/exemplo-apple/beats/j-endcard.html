<!doctype html>
<!--
  Beat J — end card. Last frame of the footage, blurred and darkened, with a
  "SEGUE PRA MAIS" headline and the instagram-follow card (slide-up, button
  press-in, elastic release, Seguir → Seguindo). Handle: @juli0net0.
  No follower count or verified badge — nothing invented.
  Mounted at global 48.85 — cue constants below are GLOBAL seconds.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          font-family: "Montserrat", sans-serif;
        }
        #j-bg {
          position: absolute;
          inset: -40px;
          background: url("assets/img/last-frame.jpg") center / cover no-repeat;
          filter: blur(26px) brightness(0.45) saturate(1.1);
          opacity: 0;
        }
        #j-tint {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 80% 60% at 50% 45%, rgba(28, 28, 28, 0.35), rgba(10, 10, 10, 0.85));
          opacity: 0;
        }
        #j-head {
          position: absolute;
          left: 0;
          width: 1080px;
          top: 600px;
          text-align: center;
        }
        .j-mask {
          display: block;
          overflow: hidden;
        }
        .j-line {
          display: block;
          font-family: "League Gothic", sans-serif;
          font-size: 210px;
          line-height: 0.92;
          color: #FFFFFF;
        }
        #j-l2 {
          color: #F97316;
        }
        #j-card {
          position: absolute;
          left: 50%;
          top: 1130px;
          display: flex;
          align-items: center;
          gap: 28px;
          background: #1C1C1C;
          border-radius: 75px;
          padding: 24px 28px 24px 24px;
          box-shadow: 0 12px 50px rgba(0, 0, 0, 0.55);
          opacity: 0;
        }
        #j-avatar {
          width: 128px;
          height: 128px;
          border-radius: 50%;
          border: 4px solid #F97316;
          box-shadow: 0 0 24px rgba(249, 115, 22, 0.45);
          background: url("assets/img/avatar.jpg") center / cover no-repeat;
          flex-shrink: 0;
        }
        #j-info {
          display: flex;
          flex-direction: column;
          gap: 2px;
          margin-right: 10px;
        }
        #j-name {
          white-space: nowrap;
          font-size: 40px;
          font-weight: 800;
          color: #fff;
          line-height: 1.25;
        }
        #j-handle {
          white-space: nowrap;
          font-size: 30px;
          font-weight: 600;
          color: #A8A8A8;
        }
        #j-btn {
          position: relative;
          width: 240px;
          height: 82px;
          border-radius: 41px;
          background: #F97316;
          flex-shrink: 0;
          overflow: hidden;
        }
        .j-btn-text {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 32px;
          font-weight: 800;
          color: #0A0A0A;
        }
        #j-following {
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="j-endcard" data-width="1080" data-height="1920">
        <div id="j-bg"></div>
        <div id="j-tint"></div>
        <div id="j-head">
          <span class="j-mask"><span class="j-line" id="j-l1">SEGUE PRA</span></span>
          <span class="j-mask"><span class="j-line" id="j-l2">MAIS</span></span>
        </div>
        <div id="j-card">
          <div id="j-avatar"></div>
          <div id="j-info">
            <div id="j-name">Julio Neto</div>
            <div id="j-handle">@juli0net0</div>
          </div>
          <div id="j-btn">
            <span class="j-btn-text" id="j-follow">Seguir</span>
            <span class="j-btn-text" id="j-following" style="color: #FFFFFF">Seguindo ✓</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var OFFSET = 48.85;
          var T = function (g) {
            return g - OFFSET;
          };
          var IN = 48.95;
          var CARD = 49.3;
          var PRESS = 49.85;
          var tl = gsap.timeline({ paused: true });
          gsap.set(["#j-l1", "#j-l2"], { yPercent: 105 });
          gsap.set("#j-card", { xPercent: -50, y: 300, opacity: 0, scale: 1.25, transformOrigin: "50% 50%" });

          tl.fromTo("#j-bg", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, T(IN));
          tl.fromTo("#j-tint", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, T(IN));
          tl.fromTo("#j-l1", { yPercent: 105 }, { yPercent: 0, duration: 0.35, ease: "power4.out", immediateRender: false }, T(IN + 0.08));
          tl.fromTo("#j-l2", { yPercent: 105 }, { yPercent: 0, duration: 0.35, ease: "power4.out", immediateRender: false }, T(IN + 0.18));
          // instagram-follow: slide up, press-in, elastic release, state flip.
          tl.to("#j-card", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T(CARD));
          tl.to("#j-btn", { scale: 0.92, duration: 0.15, ease: "power2.out" }, T(PRESS));
          tl.to("#j-btn", { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.4)" }, T(PRESS + 0.15));
          tl.to("#j-btn", { backgroundColor: "#282828", duration: 0.12, ease: "none" }, T(PRESS + 0.15));
          tl.to("#j-follow", { opacity: 0, duration: 0.08, ease: "none" }, T(PRESS + 0.15));
          tl.to("#j-following", { opacity: 1, duration: 0.08, ease: "none" }, T(PRESS + 0.18));

          window.__timelines = window.__timelines || {};
          window.__timelines["j-endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
