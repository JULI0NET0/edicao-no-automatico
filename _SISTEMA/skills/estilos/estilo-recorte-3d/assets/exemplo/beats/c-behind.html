<!DOCTYPE html>
<!--
  Estilo 3 (camada de TRÁS, entre o vídeo e o recorte do Julio) — Perspectiva 3D + recorte de fundo.
  0.30–0.85  wipe de xadrez: "sem fundo" × "original" (o recorte do Julio fica por cima, então só o fundo some)
  0.95       corta para o palco escuro com piso em perspectiva; título gigante ATRÁS do recorte
  1.38 HORAS · 3.12 SEGUNDOS (laranja) · 4.25 MINUTOS
  Montado em t=0 — tempos LOCAIS (s).
-->
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #c-chk {
          position: absolute; inset: 0; clip-path: inset(0 100% 0 0);
          background:
            conic-gradient(#2B2B2B 25%, #161616 0 50%, #2B2B2B 0 75%, #161616 0) 0 0 / 72px 72px;
        }
        #c-chk-edge {
          position: absolute; top: 0; left: 0; width: 8px; height: 1920px; opacity: 0;
          background: linear-gradient(180deg, rgba(249,115,22,0), #F97316 15%, #FDBA74 50%, #F97316 85%, rgba(249,115,22,0));
          box-shadow: 0 0 40px rgba(249, 115, 22, 0.9);
        }
        .c-pill {
          position: absolute; height: 64px; padding: 0 30px; border-radius: 32px; display: flex; align-items: center;
          font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 0.22em; opacity: 0;
        }
        #c-pill-orig { left: 56px; top: 90px; background: rgba(10,10,10,.85); color: #fff; border: 3px solid #282828; }
        #c-pill-cut { right: 56px; top: 90px; background: #F97316; color: #0A0A0A; box-shadow: 0 0 40px rgba(249,115,22,.55); }
        #c-stage {
          position: absolute; inset: 0; opacity: 0;
          background:
            radial-gradient(ellipse 70% 38% at 50% 80%, rgba(249, 115, 22, 0.34), rgba(249, 115, 22, 0) 70%),
            radial-gradient(ellipse 90% 60% at 50% 30%, #1C1C1C 0%, #0A0A0A 60%, #050505 100%);
        }
        #c-floor-wrap { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px; perspective: 700px; overflow: hidden; }
        #c-floor {
          position: absolute; left: -540px; top: 0; width: 2160px; height: 1500px; transform-origin: 50% 0%; transform: rotateX(68deg);
          background-image:
            repeating-linear-gradient(90deg, rgba(249,115,22,.35) 0 3px, transparent 3px 120px),
            repeating-linear-gradient(0deg, rgba(249,115,22,.35) 0 3px, transparent 3px 120px);
          -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%); mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
        }
        #c-glow {
          position: absolute; left: 90px; top: 560px; width: 900px; height: 900px; border-radius: 50%;
          background: radial-gradient(circle, rgba(249, 115, 22, 0.40), rgba(249, 115, 22, 0) 65%);
        }
        .c-word { position: absolute; left: 0; top: 120px; width: 1080px; display: flex; justify-content: center; transform-origin: 50% 0%; }
        .c-mask { display: inline-block; overflow: hidden; padding: 0 2px; }
        .c-letter { display: inline-block; font-family: "League Gothic", sans-serif; font-weight: 400; line-height: 0.92; color: #FFFFFF; text-shadow: 0 18px 50px rgba(0,0,0,.55); }
        #c-word2 .c-letter { color: #F97316; }
        #c-kicker {
          position: absolute; left: 0; width: 1080px; top: 56px; text-align: center; font-family: "Montserrat", sans-serif;
          font-weight: 800; font-size: 30px; letter-spacing: 0.42em; color: rgba(255,255,255,.55); opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="c-behind" data-width="1080" data-height="1920">
        <div id="c-chk"></div>
        <div id="c-chk-edge"></div>
        <div class="c-pill" data-layout-allow-occlusion id="c-pill-orig">ORIGINAL</div>
        <div class="c-pill" data-layout-allow-occlusion id="c-pill-cut">SEM FUNDO</div>
        <div id="c-stage">
          <div id="c-glow"></div>
          <div id="c-floor-wrap"><div id="c-floor" data-layout-allow-overflow></div></div>
          <div id="c-kicker" data-layout-allow-occlusion>ANTES × DEPOIS</div>
          <div class="c-word" data-layout-allow-overlap id="c-word1"></div>
          <div class="c-word" data-layout-allow-overlap id="c-word2"></div>
          <div class="c-word" data-layout-allow-overlap id="c-word3"></div>
        </div>
      </div>
      <script>
        (function () {
          var WIPE = 0.3, WIPE_END = 0.85, CUT = 0.95;
          var H1 = 1.38, H2 = 3.12, H3 = 4.25;

          function build(hostId, text) {
            var host = document.getElementById(hostId);
            var ctx = document.createElement("canvas").getContext("2d");
            var size = 900;
            while (size > 200) {
              ctx.font = "400 " + size + 'px "League Gothic"';
              if (ctx.measureText(text).width + text.length * 4 <= 1020) break;
              size -= 4;
            }
            return text.split("").map(function (ch) {
              var m = document.createElement("span"); m.className = "c-mask";
              var l = document.createElement("span"); l.className = "c-letter"; l.setAttribute("data-layout-allow-overlap",""); l.setAttribute("data-layout-allow-overflow",""); l.setAttribute("data-layout-allow-occlusion",""); l.textContent = ch; l.style.fontSize = size + "px";
              m.appendChild(l); host.appendChild(m); return l;
            });
          }
          var w1 = build("c-word1", "HORAS");
          var w2 = build("c-word2", "SEGUNDOS");
          var w3 = build("c-word3", "MINUTOS");

          var tl = gsap.timeline({ paused: true });
          gsap.set(w1.concat(w2, w3), { yPercent: 105 });
          gsap.set(["#c-word1", "#c-word2", "#c-word3"], { scaleY: 1.08 });
          gsap.set("#c-floor", { y: 0 });

          // 1) checkerboard wipe — what "recorte de fundo" does
          tl.fromTo("#c-pill-orig", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 0.05);
          tl.set("#c-chk-edge", { opacity: 1 }, WIPE);
          tl.fromTo("#c-chk", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: WIPE_END - WIPE, ease: "power2.inOut", immediateRender: false }, WIPE);
          tl.fromTo("#c-chk-edge", { x: 0 }, { x: 1072, duration: WIPE_END - WIPE, ease: "power2.inOut", immediateRender: false }, WIPE);
          tl.to("#c-chk-edge", { opacity: 0, duration: 0.08 }, WIPE_END);
          tl.fromTo("#c-pill-cut", { opacity: 0, y: -14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, WIPE_END - 0.2);
          tl.to("#c-pill-orig", { opacity: 0, duration: 0.15 }, WIPE_END - 0.1);

          // 2) hard cut to the stage with the floor in perspective
          tl.set("#c-stage", { opacity: 1 }, CUT);
          tl.set(["#c-chk", "#c-pill-cut"], { opacity: 0 }, CUT);
          tl.fromTo("#c-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, CUT + 0.05);
          tl.fromTo("#c-floor", { y: 0 }, { y: 360, duration: 4.0, ease: "none", immediateRender: false }, CUT);

          // 3) HORAS
          w1.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, H1 - 0.04 + i * 0.045);
          });
          tl.fromTo("#c-word1", { scale: 1.05 }, { scale: 1.0, duration: 0.5, ease: "expo.out", immediateRender: false }, H1);
          tl.fromTo("#c-glow", { scale: 1, opacity: 0.8 }, { scale: 1.2, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, H1);

          // 4) SEGUNDOS (orange): HORAS falls out
          w1.forEach(function (l, i) {
            tl.to(l, { yPercent: -105, duration: 0.2, ease: "power3.in" }, H2 - 0.08 + i * 0.012);
          });
          w2.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power4.out", immediateRender: false }, H2 + i * 0.035);
          });
          tl.fromTo("#c-word2", { scale: 1.07 }, { scale: 1.02, duration: 0.6, ease: "expo.out", immediateRender: false }, H2);
          tl.fromTo("#c-glow", { scale: 1.1, opacity: 0.8 }, { scale: 1.35, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, H2);

          // 5) MINUTOS
          w2.forEach(function (l, i) {
            tl.to(l, { yPercent: -105, duration: 0.2, ease: "power3.in" }, H3 - 0.08 + i * 0.01);
          });
          w3.forEach(function (l, i) {
            tl.fromTo(l, { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power4.out", immediateRender: false }, H3 + i * 0.04);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["c-behind"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
